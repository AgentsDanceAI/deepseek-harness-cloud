[project]
name = "dhc-server"
version = "0.1.0"
description = "deepseek-harness-cloud server: accounts, billing, credits, and the LLM gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "cryptography>=42",
]

[tool.setuptools]
# flat layout with app/ + config/ side by side: only app/ is the package
packages = ["app", "app.payments"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]
redis = ["redis>=5.0"]
stripe = ["stripe>=10.0"]
dev = [
    "packaging>=24.2,<27",
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    # FastAPI's dependency injection API intentionally uses Depends() defaults.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
