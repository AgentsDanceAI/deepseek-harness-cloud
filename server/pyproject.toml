[project]
name = "dhc-server"
version = "0.1.0"
description = "deepseek-harness-cloud server: accounts, billing, credits, and the LLM gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
stripe = ["stripe>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
