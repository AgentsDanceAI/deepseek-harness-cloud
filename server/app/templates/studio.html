{% extends "base.html" %}
{% block title %}媒体工作台{% endblock %}
{% block content %}
<section class="section console">
  <div class="container">
    <div class="console-head">
      <h1>媒体工作台</h1>
      <a class="btn btn-ghost btn-sm" href="/console">返回控制台</a>
    </div>

    <div class="card block">
      <p class="muted" style="margin-top:0">
        灰度中，仅管理员可用。底层走本站网关，模型由上游供应商提供。
        <b>计价是未经账单核对的占位值</b>，正式开放前会重新核准。
      </p>

      <div class="tabs" style="display:flex;gap:8px;margin:12px 0">
        <button type="button" class="btn btn-sm" data-tab="image">生图（约 15 秒）</button>
        <button type="button" class="btn btn-sm btn-ghost" data-tab="video">生视频（数分钟）</button>
      </div>

      <form id="studio-form" autocomplete="off">
        <input type="hidden" id="mode" value="image">

        <label for="model" style="display:block;margin:10px 0 4px">模型</label>
        <select id="model" style="width:100%;max-width:420px;padding:8px"></select>

        <div id="video-opts" hidden>
          <label for="resolution" style="display:block;margin:10px 0 4px">分辨率</label>
          <select id="resolution" style="width:160px;padding:8px"></select>
          <label for="duration" style="display:block;margin:10px 0 4px">时长（秒）</label>
          <input id="duration" type="number" value="5" min="1" max="30" style="width:160px;padding:8px">
          <p class="muted" style="font-size:13px">各模型的合法时长档位由上游判定；填错会原样返回厂商的错误说明。</p>
        </div>

        <label for="prompt" style="display:block;margin:10px 0 4px">描述</label>
        <textarea id="prompt" rows="3" style="width:100%;padding:8px"
                  placeholder="一只柴犬在雪地里奔跑，慢镜头，电影感"></textarea>

        <div style="margin-top:12px">
          <button type="submit" class="btn btn-primary" id="go">生成</button>
          <span id="status" class="muted" style="margin-left:10px"></span>
        </div>
      </form>
    </div>

    <div class="card block" id="out-card" hidden>
      <div id="out"></div>
    </div>
  </div>
</section>

<script id="offered-data" type="application/json">{{ offered | tojson }}</script>
<script>
(function () {
  var OFFERED = JSON.parse(document.getElementById('offered-data').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var poller = null;

  function setMode(mode) {
    $('mode').value = mode;
    $('video-opts').hidden = mode !== 'video';
    document.querySelectorAll('[data-tab]').forEach(function (b) {
      b.classList.toggle('btn-ghost', b.dataset.tab !== mode);
    });
    var list = OFFERED[mode] || [];
    $('model').innerHTML = list.length
      ? list.map(function (m) { return '<option value="' + m.id + '">' + m.name + '</option>'; }).join('')
      : '<option value="">（该类型暂无已定价的模型）</option>';
    syncResolutions();
  }

  function syncResolutions() {
    if ($('mode').value !== 'video') return;
    var m = (OFFERED.video || []).find(function (x) { return x.id === $('model').value; });
    var res = (m && m.resolutions) || [];
    $('resolution').innerHTML = res.map(function (r) {
      return '<option value="' + r + '">' + r + '</option>';
    }).join('');
  }

  function say(text) { $('status').textContent = text; }

  function busy(on) {
    $('go').disabled = on;
    if (!on && poller) { clearInterval(poller); poller = null; }
  }

  function showError(payload) {
    var msg = (payload && payload.error && (payload.error.message || payload.error.type))
      || (payload && payload.detail) || '请求失败';
    say('');
    $('out-card').hidden = false;
    $('out').innerHTML = '<p style="color:#c0392b;white-space:pre-wrap"></p>';
    $('out').firstChild.textContent = msg;
  }

  async function post(url, body) {
    var r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return { ok: r.ok, payload: await r.json().catch(function () { return null; }) };
  }

  async function runImage(model, prompt) {
    say('出图中，约 15 秒…');
    var r = await post('/llm/v1/images/generations', { model: model, prompt: prompt, n: 1 });
    busy(false);
    if (!r.ok) return showError(r.payload);
    var item = (r.payload.data || [])[0] || {};
    var src = item.url || ('data:image/png;base64,' + item.b64_json);
    $('out-card').hidden = false;
    $('out').innerHTML = '<img alt="生成结果" style="max-width:100%;border-radius:10px">';
    $('out').firstChild.src = src;
    say('完成，扣除 ' + r.payload.credits + ' 积分');
  }

  async function runVideo(model, prompt) {
    say('提交中…');
    var r = await post('/llm/v1/videos/generations', {
      model: model, prompt: prompt,
      duration: parseInt($('duration').value, 10),
      resolution: $('resolution').value
    });
    if (!r.ok) { busy(false); return showError(r.payload); }
    var jobId = r.payload.id;
    say('已提交，扣除 ' + r.payload.credits + ' 积分。生成中，可能要几分钟…');
    var started = Date.now();
    poller = setInterval(async function () {
      var res = await fetch('/llm/v1/videos/result/' + jobId);
      var d = await res.json().catch(function () { return {}; });
      if (d.task_status === 'SUCCESS') {
        busy(false);
        $('out-card').hidden = false;
        $('out').innerHTML = '<video controls playsinline style="max-width:100%;border-radius:10px"></video>';
        $('out').firstChild.src = d.video_result[0].url;
        say('完成，用时 ' + Math.round((Date.now() - started) / 1000) + ' 秒');
      } else if (d.task_status === 'FAIL') {
        busy(false);
        showError({ error: { message: '生成失败：' + (d.error || '未知原因') + '（积分已退回）' } });
      } else {
        say('生成中… 已等待 ' + Math.round((Date.now() - started) / 1000) + ' 秒');
      }
    }, 5000);
  }

  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.tab); });
  });
  $('model').addEventListener('change', syncResolutions);

  $('studio-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var model = $('model').value;
    var prompt = $('prompt').value.trim();
    if (!model) return say('没有可用模型');
    if (!prompt) return say('先写点描述');
    $('out-card').hidden = true;
    busy(true);
    ($('mode').value === 'video' ? runVideo : runImage)(model, prompt);
  });

  setMode('image');
})();
</script>
{% endblock %}
