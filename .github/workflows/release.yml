name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build exact artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      created: ${{ steps.release.outputs.created }}
      python_image: ${{ steps.release.outputs.python_image }}
      uv_image: ${{ steps.release.outputs.uv_image }}
      node_image: ${{ steps.release.outputs.node_image }}
      harness_runtime: ${{ steps.release.outputs.harness_runtime }}
      server_image: ${{ steps.release.outputs.server_image }}
      workspace_image: ${{ steps.release.outputs.workspace_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Resolve and validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./release/release.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          created="$(git show -s --format=%cI HEAD)"
          epoch="$(git show -s --format=%ct HEAD)"
          {
            echo "version=${version}"
            echo "created=${created}"
            echo "epoch=${epoch}"
            echo "python_image=$(node -p "require('./release/release.json').baseImages.python")"
            echo "uv_image=$(node -p "require('./release/release.json').baseImages.uv")"
            echo "node_image=$(node -p "require('./release/release.json').baseImages.node")"
            echo "harness_runtime=$(node -p "require('./release/release.json').harnessRuntime")"
            echo "server_image=$(node -p "require('./release/release.json').productImages.server.split(':')[0]")"
            echo "workspace_image=$(node -p "require('./release/release.json').productImages.workspace.split(':')[0]")"
          } >> "${GITHUB_OUTPUT}"
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "${GITHUB_ENV}"
      - name: Install locked test dependencies
        run: uv sync --project server --all-extras --locked
      - name: Run release verification
        run: |
          PYTHON=server/.venv/bin/python bash scripts/release/check.sh
          server/.venv/bin/python -m pytest server/tests tests/repository -q
          server/.venv/bin/python -m ruff format --check server/app server/tests server/scripts
          server/.venv/bin/python -m ruff check server/app server/tests server/scripts
          node --test server/tests/js/*.test.mjs
      - name: Build CLI artifacts once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          node scripts/release/build-packages.mjs dist/packages
          npm pack dist/packages/npm --pack-destination dist/release --json
          uv build --sdist --wheel --project dist/packages/python --out-dir dist/release
          node scripts/release/generate-sbom.mjs dist/packages \
            "dist/release/dsh-cloud-${{ steps.release.outputs.version }}.spdx.json"
          (
            cd dist/release
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name '.*' -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
      - name: Smoke test exact CLI artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "${RUNNER_TEMP}/npm-smoke" dist/release/*.tgz
          "${RUNNER_TEMP}/npm-smoke/bin/dsh-cloud" --version | grep -Fx "${{ steps.release.outputs.version }}"
          uv venv "${RUNNER_TEMP}/python-smoke"
          uv pip install --python "${RUNNER_TEMP}/python-smoke/bin/python" dist/release/*.whl
          "${RUNNER_TEMP}/python-smoke/bin/dsh-cloud" --version | grep -Fx "${{ steps.release.outputs.version }}"
          (cd dist/release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ steps.release.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/release/*

  publish:
    name: Publish registries and GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.6"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist/release
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server image
        id: server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.build.outputs.server_image }}:${{ needs.build.outputs.version }}
            ${{ needs.build.outputs.server_image }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.build.outputs.created }}
            PYTHON_IMAGE=${{ needs.build.outputs.python_image }}
            UV_IMAGE=${{ needs.build.outputs.uv_image }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.build.outputs.server_image }}
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
      - name: Build and publish workspace image
        id: workspace
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/workspace/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.build.outputs.workspace_image }}:${{ needs.build.outputs.version }}
            ${{ needs.build.outputs.workspace_image }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            REVISION=${{ github.sha }}
            NODE_IMAGE=${{ needs.build.outputs.node_image }}
            HARNESS_RUNTIME=${{ needs.build.outputs.harness_runtime }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.build.outputs.workspace_image }}
          subject-digest: ${{ steps.workspace.outputs.digest }}
          push-to-registry: true
      - name: Publish npm package
        # 认证走 OIDC trusted publishing (npm >= 11.5.1 自动使用, 需 id-token: write
        # 且包已绑 trusted publisher —— 0.2.0 起已配好, 不再有任何 token)。
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          npm publish dist/release/*.tgz --access public --provenance \
            --registry=https://registry.npmjs.org/
      - name: Publish Python package with trusted publishing
        run: uv publish --trusted-publishing always dist/release/*.whl dist/release/*.tar.gz
      - name: Verify public registries anonymously
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          # npm 新包首次进公开索引实测要 ~15 分钟 (0.2.0 发布时 publish 成功后
          # 第 14 分钟才可匿名 GET), 3 分钟的窗口把一次成功的发布误判成失败。
          for attempt in $(seq 1 90); do
            if docker buildx imagetools inspect \
                 "${{ needs.build.outputs.server_image }}:${{ needs.build.outputs.version }}" >/dev/null \
               && docker buildx imagetools inspect \
                 "${{ needs.build.outputs.workspace_image }}:${{ needs.build.outputs.version }}" >/dev/null \
               && npx --yes "@agentsdanceai/dsh-cloud@${{ needs.build.outputs.version }}" --version \
                    | grep -Fx "${{ needs.build.outputs.version }}" \
               && uvx "dsh-cloud==${{ needs.build.outputs.version }}" --version \
                    | grep -Fx "${{ needs.build.outputs.version }}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --verify-tag \
            --title "DSH Cloud ${{ needs.build.outputs.version }}" \
            --notes-file "release/notes/v${{ needs.build.outputs.version }}.md" \
            --latest
