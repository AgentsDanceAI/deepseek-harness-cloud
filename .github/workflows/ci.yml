name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install locked dependencies
        working-directory: server
        run: uv sync --all-extras --locked
      - name: Lint and test
        working-directory: server
        run: |
          uv run ruff format --check app tests scripts
          uv run ruff check app tests scripts
          uv run pytest -q
          node --test tests/js/*.test.mjs

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Verify release contract
        run: node desktop/scripts/verify-version.mjs
      - name: Assemble overlay
        run: node desktop/scripts/assemble.mjs
      - name: Install and test
        working-directory: desktop/build/upstream
        run: |
          corepack enable
          corepack yarn install
          node ../../scripts/verify-contract.mjs .
          corepack yarn typecheck
          corepack yarn test --run

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install and validate
        working-directory: mobile
        run: |
          npm ci
          npm run check
          npx cap sync android
      - name: Test Android shell
        working-directory: mobile/android
        run: ./gradlew test assembleDebug --no-daemon

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Validate deployment contracts
        run: |
          docker compose -f deploy/selfhost/docker-compose.yml config --quiet
          uv run --project server --extra dev pytest tests/deploy tests/distribution tests/repository -q
