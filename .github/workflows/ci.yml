name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install locked dependencies
        working-directory: server
        run: uv sync --all-extras --locked
      - name: Lint and test
        working-directory: server
        run: |
          uv run ruff format --check app tests scripts
          uv run ruff check app tests scripts
          uv run pytest -q
          node --test tests/js/*.test.mjs

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Verify release contract
        run: node desktop/scripts/verify-version.mjs
      - name: Assemble overlay
        run: node desktop/scripts/assemble.mjs
      - name: Install and test
        working-directory: desktop/build/upstream
        run: |
          corepack enable
          corepack yarn install
          node ../../scripts/verify-contract.mjs .
          corepack yarn typecheck
          corepack yarn test --run

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install and validate
        working-directory: mobile
        run: |
          npm ci
          npm run check
          npx cap sync android
      - name: Test Android shell
        working-directory: mobile/android
        run: ./gradlew test assembleDebug --no-daemon

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Validate deployment contracts
        run: |
          docker compose -f deploy/selfhost/docker-compose.yml config --quiet
          uv run --project server --extra dev pytest tests/deploy tests/distribution tests/repository -q
