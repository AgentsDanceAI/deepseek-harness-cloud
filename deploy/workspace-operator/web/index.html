<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Operator</title>
<style>
  /* 不引任何外部资源: 工作台容器出站受安全组约束, 拉不到 CDN 时页面会裸奔,
     而那种坏法在本地开发时完全看不出来。 */
  :root {
    --bg: #fbfbfd; --fg: #1c1c1e; --muted: #6b6b70; --line: #e4e4e8;
    --card: #fff; --accent: #2f6fed; --tool-bg: #f2f3f7; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e8e8ea; --muted: #9a9aa2; --line: #2c2d31;
      --card: #1e1f23; --accent: #5b8dff; --tool-bg: #24252a; --err: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--card); flex: none;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .sp { flex: 1; }
  select, button {
    font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bubble { white-space: pre-wrap; word-wrap: break-word; }
  .user .bubble {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px;
  }
  .tool {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    color: var(--muted); background: var(--tool-bg); border-radius: 8px;
    padding: 6px 10px; margin: 6px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .tool .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .tool.done .dot { background: #34a853; }
  .shot { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); margin: 8px 0; }
  .err { color: var(--err); }
  footer { border-top: 1px solid var(--line); background: var(--card); padding: 12px 16px; flex: none; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px;
    max-height: 180px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send { padding: 0 18px; background: var(--accent); color: #fff; border-color: var(--accent); }
  #send[disabled] { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>DSH Operator</h1>
  <span class="sp"></span>
  <select id="model" title="模型"></select>
  <button id="reset" title="清空对话">清空</button>
</header>

<div id="log"><div class="wrap" id="wrap"></div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="交代一件事，我在你的云工作台里动手做。Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint" id="hint">工作目录 /workspace 持久保存；其它位置的改动会随实例回收消失。</div>
</footer>

<script>
const wrap = document.getElementById('wrap');
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
const modelSel = document.getElementById('model');
const hint = document.getElementById('hint');
let busy = false;
const DEFAULT_HINT = hint.textContent;

const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
function scroll(force) { if (force || atBottom()) log.scrollTop = log.scrollHeight; }

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = '<div class="who"></div><div class="bubble"></div>';
  d.querySelector('.who').textContent = role === 'user' ? '你' : 'Operator';
  d.querySelector('.bubble').textContent = text || '';
  wrap.appendChild(d); scroll(true);
  return d.querySelector('.bubble');
}

function addTool(name, summary) {
  const d = document.createElement('div');
  d.className = 'tool';
  d.innerHTML = '<span class="dot"></span><span class="t"></span>';
  d.querySelector('.t').textContent = summary || name;
  wrap.appendChild(d); scroll();
  return d;
}

async function boot() {
  try {
    const m = await (await fetch('/api/models')).json();
    m.models.forEach(id => {
      const o = document.createElement('option');
      o.value = id; o.textContent = id;
      if (id === m.default) o.selected = true;
      modelSel.appendChild(o);
    });
  } catch { /* 模型列表拿不到不该挡住聊天 —— 后端会用默认模型 */ }
  try {
    const c = await (await fetch('/api/conversation')).json();
    c.messages.forEach(msg => addMsg(msg.role === 'user' ? 'user' : 'assistant', msg.content));
  } catch { /* 空对话 */ }
}

async function submit() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  addMsg('user', text);
  input.value = ''; input.style.height = 'auto';

  let bubble = null;
  const pending = new Map();
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, model: modelSel.value || null }),
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE 以空行分帧。**必须按帧切**而不是按行读: 一个 chunk 里可能有半帧,
      // 按行读会把半个 JSON 交给 parse，然后整轮界面卡死在那一条上。
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!frame.startsWith('data: ')) continue;
        const ev = JSON.parse(frame.slice(6));
        if (ev.type === 'text') {
          if (!bubble) bubble = addMsg('assistant', '');
          bubble.textContent += ev.text; scroll();
        } else if (ev.type === 'tool') {
          pending.set(ev.id, addTool(ev.name, '正在' + ev.name));
          bubble = null;   // 工具之后模型还会继续说，另起一段
        } else if (ev.type === 'result') {
          const el = pending.get(ev.id);
          if (el) { el.classList.add('done'); el.querySelector('.t').textContent = ev.summary; }
        } else if (ev.type === 'image') {
          const img = document.createElement('img');
          img.className = 'shot'; img.src = ev.data_uri;
          wrap.appendChild(img); scroll();
        } else if (ev.type === 'end') {
          if (ev.note) hint.textContent = ev.note;
          if (ev.usage && ev.usage.total_tokens) {
            hint.textContent = '本轮用了 ' + ev.usage.total_tokens + ' tokens。' +
              '工作目录 /workspace 持久保存。';
          }
        } else if (ev.type === 'error') {
          const e = addMsg('assistant', ev.message);
          e.classList.add('err'); bubble = null;
        }
      }
    }
  } catch (e) {
    addMsg('assistant', '连接中断: ' + e.message).classList.add('err');
  } finally {
    busy = false; send.disabled = false; input.focus();
  }
}

send.onclick = submit;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});
// 清空也要占住 busy 闸。它是 async 的: 不占闸的话, 用户点完清空立刻发消息,
// 这里的 innerHTML='' 会在消息**已经渲染之后**才跑, 把他自己刚发的那句抹掉 ——
// 服务端有记录、屏幕上没有, 看着就是丢消息。
document.getElementById('reset').onclick = async () => {
  if (busy) return;
  busy = true; send.disabled = true;
  try {
    await fetch('/api/reset', { method: 'POST' });
    wrap.innerHTML = '';
    hint.textContent = DEFAULT_HINT;
  } catch (e) {
    addMsg('assistant', '清空失败: ' + e.message).classList.add('err');
  } finally {
    busy = false; send.disabled = false;
  }
};
boot();
</script>
</body>
</html>
