<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Team</title>
<style>
  /* 零外部资源: 工作台容器出站受安全组约束, 拉不到 CDN 时页面会裸奔,
     而那种坏法在本地开发时完全看不出来。 */
  :root {
    --bg:#fbfbfd; --fg:#1c1c1e; --muted:#6b6b70; --line:#e4e4e8;
    --card:#fff; --accent:#2f6fed; --tool:#f2f3f7; --err:#c0392b; --side:#f6f6f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#16171a; --fg:#e8e8ea; --muted:#9a9aa2; --line:#2c2d31;
      --card:#1e1f23; --accent:#5b8dff; --tool:#24252a; --err:#ff6b5e; --side:#131417;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; height:100vh; display:flex; background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  /* 侧栏 */
  aside { width:220px; flex:none; background:var(--side); border-right:1px solid var(--line);
          display:flex; flex-direction:column; }
  aside h2 { font-size:12px; color:var(--muted); margin:14px 14px 6px; font-weight:600;
             letter-spacing:.04em; text-transform:uppercase; }
  .rooms { flex:1; overflow-y:auto; padding:0 8px 8px; }
  .room { padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px; }
  .room:hover { background:var(--card); }
  .room.on { background:var(--card); box-shadow:inset 2px 0 0 var(--accent); }
  .room .n { font-size:14px; }
  .room .l { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden;
             text-overflow:ellipsis; }
  aside button { margin:8px 12px 12px; }
  /* 主区 */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px;
           border-bottom:1px solid var(--line); background:var(--card); flex:none; }
  header .title { font-weight:600; font-size:15px; }
  header .sp { flex:1; }
  .chip { font-size:12px; padding:2px 8px; border:1px solid var(--line);
          border-radius:20px; color:var(--muted); }
  button, select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line);
                   border-radius:8px; padding:5px 10px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  #log { flex:1; overflow-y:auto; padding:20px 16px; }
  .wrap { max-width:820px; margin:0 auto; }
  .msg { margin-bottom:16px; display:flex; gap:10px; }
  .av { width:30px; height:30px; border-radius:50%; background:var(--tool); flex:none;
        display:flex; align-items:center; justify-content:center; font-size:16px; }
  .body { min-width:0; flex:1; }
  .who { font-size:12px; color:var(--muted); margin-bottom:2px; }
  /* 机器人正文走 markdown 渲染 —— pre-wrap 会让块级元素之间多出空行,
     所以只给用户气泡保留 (他打的换行就该原样保留)。 */
  .txt { word-wrap:break-word; }
  .msg.user .txt { white-space:pre-wrap; }
  /* markdown 排版: 字重按 AgentsDance 的口径减到 600 —— 模型爱整段加粗,
     700 在满屏中文里像一堵黑墙。标题要拉开层级, 否则一屏望过去分不出结构。 */
  .txt h1,.txt h2,.txt h3,.txt h4,.txt h5,.txt h6 { margin:.7em 0 .35em; font-weight:600; line-height:1.35; }
  .txt h1 { font-size:1.35em; } .txt h2 { font-size:1.2em; } .txt h3 { font-size:1.08em; }
  .txt h4,.txt h5,.txt h6 { font-size:1em; }
  .txt p { margin:.45em 0; }
  .txt strong { font-weight:600; }
  .txt ul,.txt ol { margin:.45em 0; padding-left:1.5em; }
  .txt li { margin:.2em 0; }
  .txt blockquote { margin:.5em 0; padding:.1em 0 .1em .8em;
                    border-left:3px solid var(--line); color:var(--muted); }
  .txt code { padding:.1em .3em; border-radius:4px; background:rgba(127,127,127,.14);
              font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.88em; word-break:break-all; }
  .txt pre { margin:.5em 0; padding:.7em .8em; border-radius:8px; overflow-x:auto;
             background:rgba(127,127,127,.12); }
  .txt pre code { padding:0; background:none; font-size:.85em; }
  .txt hr { margin:.8em 0; border:0; border-top:1px solid var(--line); }
  .txt a { color:#4c6ef5; }
  /* 窄屏横滚: 表格自己滚, 页面不横滚 */
  .txt .tw { overflow-x:auto; margin:.5em 0; }
  .txt table { border-collapse:collapse; font-size:.94em; }
  .txt th,.txt td { border:1px solid var(--line); padding:.35em .6em; text-align:left; }
  .txt th { font-weight:600; background:rgba(127,127,127,.08); }
  /* 首尾元素不要额外撑高气泡 */
  .txt > :first-child { margin-top:0; } .txt > :last-child { margin-bottom:0; }
  .msg.user { flex-direction:row-reverse; }
  .msg.user .body { max-width:78%; }
  .msg.user .who { text-align:right; }
  .msg.user .txt { background:var(--card); border:1px solid var(--line);
                   border-radius:12px; padding:9px 13px; }
  .tool { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);
          background:var(--tool); border-radius:8px; padding:5px 9px; margin:5px 0;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .tool .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }
  .tool.done .dot { background:#34a853; }
  /* 工具行折叠组: 默认只露一行摘要 (此刻在干嘛), 点开看全部 */
  .toolbox { margin:5px 0; }
  .toolbox .th { display:flex; align-items:center; gap:8px; width:100%; text-align:left;
                 font-size:12.5px; color:var(--muted); background:var(--tool);
                 border:0; border-radius:8px; padding:5px 9px; cursor:pointer;
                 font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .toolbox .th .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }
  .toolbox .sum { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toolbox .chev { width:14px; height:14px; flex:none; opacity:.5; transition:transform .15s; }
  .toolbox.open .chev { transform:rotate(180deg); }
  .toolbox .tl { display:none; padding-left:10px; border-left:2px solid var(--line); margin:4px 0 0 4px; }
  .toolbox.open .tl { display:block; }
  /* 谁在工作要一眼看得出 —— 跑动中的那位气泡左侧亮一条 */
  .msg.bot.running .body { border-left:2px solid var(--accent); padding-left:8px; }
  .msg.bot.running .who::after { content:' · 工作中'; color:var(--accent); }
  .shot { max-width:100%; border-radius:10px; border:1px solid var(--line); margin:6px 0; }
  .err { color:var(--err); }
  footer { border-top:1px solid var(--line); background:var(--card); padding:12px 16px; flex:none; }
  .composer { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; font:inherit; color:var(--fg); background:var(--bg);
             border:1px solid var(--line); border-radius:10px; padding:9px 12px;
             min-height:42px; max-height:180px; }
  textarea:focus { outline:none; border-color:var(--accent); }
  #send { padding:0 18px; background:var(--accent); color:#fff; border-color:var(--accent); }
  #send[disabled] { opacity:.5; cursor:default; }
  .hint { max-width:820px; margin:6px auto 0; font-size:12px; color:var(--muted); }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card);
           color:var(--fg); padding:18px; min-width:300px; }
  dialog h3 { margin:0 0 10px; font-size:15px; }
  dialog label { display:flex; align-items:center; gap:8px; padding:5px 0; cursor:pointer; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  @media (max-width:720px) { aside { display:none; } }
</style>
</head>
<body>
<aside>
  <h2>房间</h2>
  <div class="rooms" id="rooms"></div>
  <button id="newRoom">＋ 拉个群</button>
  <button id="newFilm">🎬 开新片</button>
</aside>

<main>
  <header>
    <span class="title" id="title">—</span>
    <span id="members"></span>
    <span class="sp"></span>
    <select id="model" title="模型"></select>
    <button id="edit">成员</button>
  </header>
  <div id="log"><div class="wrap" id="wrap"></div></div>
  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="说一件事，群里的机器人会同时开工。Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint" id="hint">同一轮里成员是同时对你说话，彼此看不到对方这一轮说了什么；再发一轮它们就能接上话。</div>
  </footer>
</main>

<dialog id="picker">
  <h3 id="pickTitle">选成员</h3>
  <div id="pickList"></div>
  <div class="row"><button id="pickCancel">取消</button><button id="pickOk">确定</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const wrap = $('wrap'), log = $('log'), input = $('input'), send = $('send');
const DEFAULT_HINT = $('hint').textContent;
let BOTS = {}, ROOMS = [], cur = null, busy = false;

const at = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
const scroll = f => { if (f || at()) log.scrollTop = log.scrollHeight; };
const botOf = id => BOTS[id] || { name: id, emoji: '🤖' };

// ── 轻量 Markdown 渲染 (照 AgentsDance 的 MarkdownText 搬, 零依赖) ──────────
// 覆盖 LLM 常用子集: 标题/有序·无序列表/加粗·斜体·行内代码/链接/引用/分割线/
// 代码块/表格/段落。**可对流式增量文本反复渲染** —— 每来一块就整份重渲, 因为
// 函数是纯的且便宜; 增量拼 HTML 反而会在标记跨块断开时渲染出半截标签。
//
// ⚠️ React 那边自动转义, 原生这边**必须自己先转义再拼 HTML** —— 机器人的输出
// 里出现 <script> 或 <img onerror> 就是 XSS, 而它的输出我们控制不了。
// 所以: 一切进入 innerHTML 的文本, 都先过 esc()。
function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 行内: `代码` **粗** [文字](链接) *斜* —— 输入已转义, 这里只认标记
function mdInline(t) {
  let h = esc(t);
  h = h.replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
  h = h.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
  // 链接只放行 http(s): —— javascript: 伪协议是另一条 XSS 路
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return h;
}

function mdRender(src) {
  const lines = String(src || '').split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    // 代码块 ```lang ... ```  (流式期间可能还没收到闭合行 —— 收到多少渲染多少)
    if (/^\s*```/.test(ln)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (!ln.trim()) { i++; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(ln)) { out.push('<hr>'); i++; continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(ln);
    if (h) {
      const lv = h[1].length;
      out.push('<h' + lv + '>' + mdInline(h[2]) + '</h' + lv + '>');
      i++; continue;
    }
    // 引用块: 连续的 > 行并成一块 (截图里阿导整段发言就是这个形状)
    if (/^\s*>\s?/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      out.push('<blockquote>' + mdRender(buf.join('\n')) + '</blockquote>');
      continue;
    }
    // 表格: 必须有分隔行才算 —— 否则正文里一句带竖线的话会被误吞
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length
        && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(lines[i]);
      i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
      out.push('<div class="tw"><table><thead><tr>'
        + head.map(c => '<th>' + mdInline(c) + '</th>').join('')
        + '</tr></thead><tbody>'
        + body.map(r => '<tr>' + r.map(c => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('')
        + '</tbody></table></div>');
      continue;
    }
    // 有序 / 无序列表
    const ordered = /^\s*\d+[.)]\s+/.test(ln);
    if (ordered || /^\s*[-*+]\s+/.test(ln)) {
      const tag = ordered ? 'ol' : 'ul';
      const re = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
      const items = [];
      while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, ''));
      out.push('<' + tag + '>' + items.map(x => '<li>' + mdInline(x) + '</li>').join('') + '</' + tag + '>');
      continue;
    }
    // 段落: 吃到空行为止, 行内换行保留
    const para = [];
    while (i < lines.length && lines[i].trim()
           && !/^\s*(#{1,6}\s|>|```|[-*+]\s|\d+[.)]\s)/.test(lines[i])
           && !/^\s*(---|\*\*\*|___)\s*$/.test(lines[i])) para.push(lines[i++]);
    if (para.length) out.push('<p>' + mdInline(para.join('\n')).replace(/\n/g, '<br>') + '</p>');
    else i++;
  }
  return out.join('');
}

// 机器人正文一律走 markdown; 用户自己打的字保持原样 (他打什么就是什么)
function setText(el, text, isUser) {
  el.dataset.raw = text || '';
  if (isUser) el.textContent = text || '';
  else el.innerHTML = mdRender(text || '');
}


function msgEl(sender, text) {
  const isUser = sender === 'user', b = botOf(sender);
  const d = document.createElement('div');
  d.className = 'msg ' + (isUser ? 'user' : 'bot');
  d.innerHTML = '<div class="av"></div><div class="body"><div class="who"></div>'
              + '<div class="txt"></div></div>';
  d.querySelector('.av').textContent = isUser ? '🙂' : b.emoji;
  d.querySelector('.who').textContent = isUser ? '你' : b.name;
  setText(d.querySelector('.txt'), text, isUser);
  wrap.appendChild(d); scroll(true);
  return d;
}

// 工具行折叠 (2026-08-31 老板: "屏幕有限, 用户很难捕捉哪个专家正在工作")。
// 一个工位随手就是十几步, 平铺开来能把整屏占满 —— 谁在干活反而看不出来了。
// 收成一行: 「⚙ 第 N 步 · 正在做什么 ⌄」, 点开看全部。跑动中始终露出**最后一行**
// (那才是"此刻在干嘛"), 收尾后自动收起。
function toolBox(container) {
  let box = container.querySelector(':scope > .toolbox');
  if (box) return box;
  box = document.createElement('div');
  box.className = 'toolbox';
  box.innerHTML = '<button class="th" type="button">'
                + '<span class="dot"></span><span class="sum"></span>'
                + '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
                + ' stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>'
                + '<div class="tl"></div>';
  box.querySelector('.th').onclick = () => {
    box.classList.toggle('open');
    if (box.classList.contains('open')) scroll();
  };
  container.appendChild(box);
  return box;
}

function toolRow(container, label) {
  const box = toolBox(container);
  const list = box.querySelector('.tl');
  const t = document.createElement('div');
  t.className = 'tool';
  t.innerHTML = '<span class="dot"></span><span class="t"></span>';
  t.querySelector('.t').textContent = label;
  list.appendChild(t);
  syncToolSummary(box);
  scroll();
  return t;
}

// 摘要永远反映**最后一行** —— 用户要的是"此刻在干嘛", 不是"一共干了多少"
function syncToolSummary(box) {
  const rows = box.querySelectorAll('.tl > .tool');
  const last = rows[rows.length - 1];
  const n = rows.length;
  box.querySelector('.sum').textContent =
    (last ? last.querySelector('.t').textContent : '') + (n > 1 ? ` · ${n} 步` : '');
}

// 退避探活: 容器被回收后要几十秒才重建好, 一次失败就放弃等于白重连。
async function waitForBackend(tries) {
  for (let i = 0; i < tries; i++) {
    await new Promise(r => setTimeout(r, Math.min(1000 * 2 ** i, 8000)));
    try {
      const r = await fetch('/api/rooms', { credentials: 'same-origin' });
      if (r.ok) return true;
    } catch (e) { /* 还没起来, 接着等 */ }
  }
  return false;
}

async function api(path, opt) {
  const r = await fetch(path, opt);
  return r.json();
}

async function loadRooms(select) {
  const d = await api('/api/rooms');
  ROOMS = d.rooms;
  $('rooms').innerHTML = '';
  ROOMS.forEach(r => {
    const el = document.createElement('div');
    el.className = 'room' + (r.id === (cur && cur.id) ? ' on' : '');
    el.innerHTML = '<div class="n"></div><div class="l"></div>';
    el.querySelector('.n').textContent =
      r.members.map(m => botOf(m).emoji).join('') + ' ' + r.name;
    el.querySelector('.l').textContent = r.last || '还没说过话';
    el.onclick = () => open(r);
    $('rooms').appendChild(el);
  });
  if (select && ROOMS.length) open(ROOMS.find(r => r.id === select) || ROOMS[0]);
  else if (!cur && ROOMS.length) open(ROOMS[0]);
}

async function open(room) {
  cur = room;
  $('title').textContent = room.name;
  $('members').innerHTML = '';
  room.members.forEach(m => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = botOf(m).emoji + ' ' + botOf(m).name;
    $('members').appendChild(c);
  });
  wrap.innerHTML = '';
  const d = await api('/api/rooms/' + room.id + '/messages');
  d.messages.forEach(m => {
    const el = msgEl(m.sender, m.text);
    (m.tools || []).forEach(s => {
      const t = toolRow(el.querySelector('.body'), s); t.classList.add('done');
      syncToolSummary(t.closest('.toolbox'));
    });
  });
  Array.from($('rooms').children).forEach((el, i) =>
    el.classList.toggle('on', ROOMS[i].id === room.id));
  scroll(true);
}

async function submit() {
  const text = input.value.trim();
  if (!text || busy || !cur) return;
  busy = true; send.disabled = true;
  msgEl('user', text);
  input.value = ''; input.style.height = 'auto';

  // 几个机器人同时说话 —— 每个各自一个气泡, 按 bot id 归位。
  // 用一个 map 而不是"最后一个气泡": 并行时事件是交错到达的, 追加到最后一个
  // 气泡会把甲的话接到乙嘴里。
  const bubbles = new Map(), tools = new Map();
  const bubbleFor = id => {
    if (!bubbles.has(id)) bubbles.set(id, msgEl(id, ''));
    const el = bubbles.get(id);
    // 谁在工作要一眼看得出: 只有**最新出现**的那位挂 running, 前面的摘掉。
    // 接力模式下这就等于"当前这一棒是谁" —— 屏幕有限, 这比堆一屏工具行有用。
    if (!el.classList.contains('running')) {
      wrap.querySelectorAll('.msg.bot.running').forEach(x => x.classList.remove('running'));
      el.classList.add('running');
    }
    return el;
  };
  try {
    const r = await fetch('/api/rooms/' + cur.id + '/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, model: $('model').value || null }),
    });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE 以空行分帧。**必须按帧切**而不是按行读: 一个 chunk 里可能有半帧,
      // 按行读会把半个 JSON 交给 parse, 整个界面卡死在那一条上。
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!frame.startsWith('data: ')) continue;
        const ev = JSON.parse(frame.slice(6));
        const body = ev.bot ? bubbleFor(ev.bot).querySelector('.body') : null;
        if (ev.type === 'text') {
          {
            const el = bubbleFor(ev.bot).querySelector('.txt');
            setText(el, (el.dataset.raw || '') + ev.text, false);
            scroll();
          }
        } else if (ev.type === 'tool') {
          tools.set(ev.bot + ':' + ev.id, toolRow(body, '正在' + ev.name));
        } else if (ev.type === 'result') {
          const t = tools.get(ev.bot + ':' + ev.id);
          if (t) { t.classList.add('done'); t.querySelector('.t').textContent = ev.summary; }
        } else if (ev.type === 'image') {
          const img = document.createElement('img');
          img.className = 'shot'; img.src = ev.data_uri; body.appendChild(img); scroll();
        } else if (ev.type === 'end') {
          // 这一棒交了 —— 摘掉工作中标记, 工具组收起 (跑完了就不该再占屏)
          const done = bubbles.get(ev.bot);
          if (done) {
            done.classList.remove('running');
            done.querySelectorAll('.toolbox.open').forEach(b => b.classList.remove('open'));
          }
          if (ev.note) $('hint').textContent = ev.note;
        } else if (ev.type === 'error') {
          const el = ev.bot ? bubbleFor(ev.bot) : msgEl('system', '');
          el.querySelector('.txt').textContent += (ev.message || '出错了');
          el.querySelector('.txt').classList.add('err');
        }
      }
    }
  } catch (e) {
    // 断流不是终点 (2026-09-01): 容器被回收/网络抖动都会把 SSE 掐断, 而**接力
    // 状态在服务端**(room.resume_at) —— 重连后发一句"继续"就从原地接着跑。
    // 原先只留一行红字, 用户面对的是一条死掉的流水线, 只能自己猜要不要重发。
    // 与口袋专家那边同一个教训: 自动重连必须真的存在, 不能只在错误里说一句。
    const el = msgEl('system', '连接中断: ' + e.message + ' — 正在重连…');
    el.querySelector('.txt').classList.add('err');
    const ok = await waitForBackend(6);
    if (ok) {
      setText(el.querySelector('.txt'),
              '连接已恢复。工作台还在跑 — 回一句「继续」就从中断处接着干。', false);
      el.querySelector('.txt').classList.remove('err');
      await loadRooms(cur.id);
    } else {
      setText(el.querySelector('.txt'),
              '连接中断且重连未成功。云电脑可能已回收 — 刷新页面会重新开机, 文件和进度都在。', false);
    }
  } finally {
    busy = false; send.disabled = false; input.focus();
    loadRooms(cur.id);
  }
}

// --- 成员选择 (拉群 / 改成员共用) -------------------------------------------
function pick(title, checked) {
  return new Promise(resolve => {
    $('pickTitle').textContent = title;
    $('pickList').innerHTML = '';
    Object.values(BOTS).forEach(b => {
      const l = document.createElement('label');
      l.innerHTML = '<input type="checkbox" value="' + b.id + '">'
                  + '<span>' + b.emoji + ' ' + b.name + '</span>';
      l.querySelector('input').checked = checked.includes(b.id);
      $('pickList').appendChild(l);
    });
    const dlg = $('picker');
    const done = v => { dlg.close(); resolve(v); };
    $('pickOk').onclick = () => done(
      Array.from($('pickList').querySelectorAll('input:checked')).map(i => i.value));
    $('pickCancel').onclick = () => done(null);
    dlg.showModal();
  });
}

$('newRoom').onclick = async () => {
  const m = await pick('拉谁进群？', []);
  if (!m || !m.length) return;
  const d = await api('/api/rooms', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ members: m }),
  });
  if (d.room) { cur = d.room; await loadRooms(d.room.id); }
};

// 开新片: 剧组五个工位按接力顺序自动入群 —— 用户提一个想法就该开工, 不该先手工
// 拉五个人, 更不该自己记住谁先谁后。
$('newFilm').onclick = async () => {
  const name = prompt('这部片叫什么？(可留空)', '') ?? null;
  if (name === null) return;
  const d = await api('/api/rooms/crew', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (d.room) { cur = d.room; await loadRooms(d.room.id); }
};

$('edit').onclick = async () => {
  if (!cur) return;
  const m = await pick('群成员', cur.members);
  if (!m) return;
  const d = await api('/api/rooms/' + cur.id + '/members', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ members: m }),
  });
  if (d.room) { cur = d.room; await loadRooms(d.room.id); }
};

send.onclick = submit;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

(async function boot() {
  const b = await api('/api/bots');
  b.bots.forEach(x => BOTS[x.id] = x);
  try {
    const m = await api('/api/models');
    m.models.forEach(id => {
      const o = document.createElement('option');
      o.value = id; o.textContent = id;
      if (id === m.default) o.selected = true;
      $('model').appendChild(o);
    });
  } catch { /* 模型列表拿不到不该挡住聊天, 后端会用默认模型 */ }
  await loadRooms();
})();
</script>
<script>
// 工作台守护层 —— 所有产品共用, 由服务端注入进工作台文档 (见 _guard_inject)。
//
// 干两件事:
//
// ① **心跳**。回收判据原先靠"请求流量"当在场信号 (Caddy 的 forward_auth 会为
//    页面上每个资源打一次 /api/work/route)。但流量治不了**长连接**: 一条挂着
//    几分钟的 SSE 期间, 页面一个新请求都不发 —— 看起来就跟标签页关了一模一样。
//    2026-09-01 老板守着浏览器看剧组跑片, 容器被判 "tab closed" 收掉, 屏幕上
//    只留一句 "Load failed"。心跳是主动的, 不受连接形态影响。
//
// ② **回收前弹窗**。判据总有失灵的时候 (那次就是 agent 活动信号传错了键,
//    一直读到 0), 而代价是用户正干着的活当场没了。所以服务端改成"先挂牌再等",
//    这里把牌子变成一个看得见的确认框: 120 秒倒计时, 点「继续用」就摘牌。
//
// 页面不可见时不发心跳 —— 那时本来就该按空闲计。切回来立刻补一发, 否则用户
// 回到标签页的头几秒里仍可能被收掉。
(function () {
  'use strict';
  if (window.__dshGuard) return;          // 注入两次也只跑一份
  window.__dshGuard = true;

  var HEARTBEAT_MS = 45000;               // 远小于最短宽限 (3 分钟), 留足余量
  var POLL_MS = 15000;                    // 挂牌到弹窗之间最多晚 15 秒
  var box = null, timer = null, left = 0;

  function post(path) {
    return fetch(path, { method: 'POST', credentials: 'same-origin' }).catch(function () {});
  }

  function beat() {
    if (document.visibilityState === 'hidden') return;
    post('/api/work/heartbeat');
  }

  function close() {
    if (timer) { clearInterval(timer); timer = null; }
    if (box && box.parentNode) box.parentNode.removeChild(box);
    box = null;
  }

  function keep() {
    close();
    post('/api/work/keep').then(beat);
  }

  // 弹窗自带全部样式并挂在 <body> 末尾 —— 宿主是 Dify/Coze/ComfyUI 这些第三方
  // 界面, 不能假设它们有任何 CSS 框架, 也不能污染它们的类名。
  function open(seconds) {
    if (box) return;
    left = seconds;
    box = document.createElement('div');
    box.setAttribute('style', [
      'position:fixed', 'inset:0', 'z-index:2147483647',
      'display:flex', 'align-items:center', 'justify-content:center',
      'background:rgba(0,0,0,.45)',
      'font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
    ].join(';'));
    box.innerHTML =
      '<div style="max-width:380px;margin:16px;padding:22px 24px;border-radius:14px;' +
      'background:#fff;color:#1a1a1a;box-shadow:0 18px 48px rgba(0,0,0,.28)">' +
      '<div style="font-size:16px;font-weight:600;margin-bottom:8px">这台云电脑还在用吗？</div>' +
      '<div style="color:#555;margin-bottom:6px">看起来闲了一会儿。' +
      '<b id="dsh-guard-n"></b> 秒后会自动回收以省下机时。</div>' +
      '<div style="color:#888;font-size:12.5px;margin-bottom:18px">' +
      '回收只是关机 —— 文件都在, 下次打开还能接着用。</div>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end">' +
      '<button id="dsh-guard-stop" style="padding:8px 14px;border-radius:9px;border:1px solid #ddd;' +
      'background:#fff;color:#555;cursor:pointer">现在就收</button>' +
      '<button id="dsh-guard-keep" style="padding:8px 16px;border-radius:9px;border:0;' +
      'background:#4c6ef5;color:#fff;font-weight:600;cursor:pointer">继续用</button>' +
      '</div></div>';
    document.body.appendChild(box);
    var n = box.querySelector('#dsh-guard-n');
    n.textContent = left;
    box.querySelector('#dsh-guard-keep').onclick = keep;
    // 「现在就收」不主动调停止端点 —— 让它自然走完倒计时即可, 少一条能误伤的路径
    box.querySelector('#dsh-guard-stop').onclick = close;
    timer = setInterval(function () {
      left -= 1;
      if (left <= 0) { close(); return; }
      n.textContent = left;
    }, 1000);
  }

  function poll() {
    fetch('/api/work/reclaim', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s && s.asking) open(s.seconds_left || 0);
        else close();                     // 服务端摘牌了 (比如别处有了活动)
      })
      .catch(function () {});
  }

  beat();
  poll();
  setInterval(beat, HEARTBEAT_MS);
  setInterval(poll, POLL_MS);
  // 切回标签页立刻补一发 —— 否则回来的头几秒里仍可能被收掉
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { beat(); poll(); }
  });
})();

</script>
