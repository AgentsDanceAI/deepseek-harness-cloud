<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Team</title>
<style>
  /* 零外部资源: 工作台容器出站受安全组约束, 拉不到 CDN 时页面会裸奔,
     而那种坏法在本地开发时完全看不出来。 */
  /* 设计语言照 AgentsDanceCloud (2026-07 设计系统 v2): 暖米灰纸面 + 墨色主操作 +
     白卡片/发丝线/12px 圆角; 蓝色只留给 info, 紫色做智能体点缀。 */
  :root {
    --bg:#f7f5f2; --fg:#333137; --muted:#5b5761; --faint:#96939a; --line:#e4e2dd;
    --line-soft:#eeece8; --card:#fff; --tool:#f6f4f0; --tool-bg:#faf9f7;
    --accent:#27262a; --accent-hover:#3b393f; --accent-fg:#fff;
    --agent:#7c5cf6; --agent-bg:#ece8fd; --ok:#00b42a; --info:#3370FF; --err:#c2453f;
    --side:#27262a; --side-fg:#ecebe8; --side-muted:#a9a6ad; --side-line:rgba(255,255,255,.09);
    --side-hover:#3b393f; --side-on:#403e45;
    --shadow:0 1px 1px rgba(0,0,0,.02); --shadow-lg:0 8px 30px rgba(43,38,31,.06);
    --code-bg:#1f1e23; --code-fg:#e8e8ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#16171a; --fg:#e8e8ea; --muted:#9a9aa2; --faint:#6f6f76; --line:#2c2d31;
      --line-soft:#26272b; --card:#1e1f23; --tool:#24252a; --tool-bg:#1b1c20;
      --accent:#e8e8ea; --accent-hover:#fff; --accent-fg:#16171a;
      --agent:#a08bff; --agent-bg:#2a2540; --err:#ff6b5e;
      --side:#111214; --side-fg:#e8e8ea; --side-muted:#8a8a92; --side-line:rgba(255,255,255,.07);
      --side-hover:#1e1f23; --side-on:#26272c;
      --shadow:none; --shadow-lg:0 8px 30px rgba(0,0,0,.35);
      --code-bg:#0f1012; --code-fg:#e8e8ea;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:2px solid var(--agent); outline-offset:2px; }
  body {
    margin:0; height:100vh; display:flex; background:var(--bg); color:var(--fg);
    font:14.5px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(127,127,127,.35); border-radius:3px; }

  /* ── 侧栏: 墨色 ─────────────────────────────────────────────────────── */
  aside { width:240px; flex:none; background:var(--side); color:var(--side-fg);
          display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:10px; padding:16px 16px 12px; }
  .brand .logo { width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.1);
                 display:flex; align-items:center; justify-content:center; font-size:16px; }
  .brand .name { font-size:14px; font-weight:600; letter-spacing:.01em; }
  .brand .sub { font-size:11px; color:var(--side-muted); margin-top:-1px; }
  aside h2 { font-size:11px; color:var(--side-muted); margin:10px 16px 6px; font-weight:600;
             letter-spacing:.06em; text-transform:uppercase; }
  .rooms { flex:1; overflow-y:auto; padding:0 8px 8px; }
  .room { position:relative; padding:8px 10px 8px 12px; border-radius:10px; cursor:pointer;
          margin-bottom:2px; transition:background .12s; }
  .room:hover { background:var(--side-hover); }
  .room.on { background:var(--side-on); }
  .room.on::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px;
                     border-radius:0 3px 3px 0; background:var(--side-fg); }
  .room .n { font-size:13px; font-weight:500; color:var(--side-fg); white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }
  .room .l { font-size:12px; color:var(--side-muted); white-space:nowrap; overflow:hidden;
             text-overflow:ellipsis; margin-top:1px; }
  aside .actions { padding:8px 12px 14px; border-top:1px solid var(--side-line);
                   display:flex; flex-direction:column; gap:6px; }
  aside button { margin:0; width:100%; background:transparent; color:var(--side-fg);
                 border:1px solid var(--side-line); border-radius:10px; padding:8px 12px;
                 font-size:13px; text-align:left; }
  aside button:hover { background:var(--side-hover); border-color:rgba(255,255,255,.18); }
  aside #newTeam { background:var(--side-fg); color:var(--side); border-color:transparent; font-weight:600; }
  aside #newTeam:hover { background:#fff; }

  /* ── 主区 ───────────────────────────────────────────────────────────── */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:10px; padding:0 18px; height:54px;
           border-bottom:1px solid var(--line); background:var(--card); flex:none; }
  header .title { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .sp { flex:1; }
  #members { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; font-size:12px; padding:3px 10px; line-height:16px;
          border:1px solid var(--line); border-radius:999px; color:var(--muted); background:var(--card); }
  button, select { font:inherit; font-size:13px; color:var(--muted); background:var(--card);
                   border:1px solid var(--line); border-radius:9px; padding:0 12px; height:32px;
                   cursor:pointer; box-shadow:var(--shadow); transition:background .15s,border-color .15s,color .15s; }
  button:hover, select:hover { border-color:#cbc8c1; color:var(--fg); }
  .navbtn { display:none; width:32px; padding:0; font-size:16px; }
  #log { flex:1; overflow-y:auto; padding:24px 20px; }
  .wrap { max-width:860px; margin:0 auto; }

  /* 消息行: 机器人不加气泡 (照 AgentsDance 的 AgentRunView), 用户一句话用墨色气泡靠右 */
  .msg { margin-bottom:22px; display:flex; gap:12px; }
  .av { width:32px; height:32px; border-radius:50%; background:var(--agent-bg); flex:none;
        display:flex; align-items:center; justify-content:center; font-size:16px; }
  .body { min-width:0; flex:1; }
  .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .txt { word-wrap:break-word; color:var(--fg); }
  .msg.user .txt { white-space:pre-wrap; }
  /* markdown 排版 (字号阶梯照 MarkdownText: 20/18/16, 字重 600, 模型爱整段加粗) */
  .txt h1,.txt h2,.txt h3,.txt h4,.txt h5,.txt h6 { margin:1.1em 0 .45em; font-weight:600; line-height:1.35; }
  .txt h1 { font-size:20px; } .txt h2 { font-size:18px; } .txt h3 { font-size:16px; font-weight:500; }
  .txt h4,.txt h5,.txt h6 { font-size:15px; font-weight:500; }
  .txt p { margin:.6em 0; }
  .txt strong { font-weight:600; }
  .txt ul,.txt ol { margin:.6em 0; padding-left:1.4em; }
  .txt li { margin:.3em 0; }
  .txt blockquote { margin:.7em 0; padding:.1em 0 .1em .8em; border-left:2px solid #cfcbc4; color:var(--muted); }
  .txt code { padding:.1em .35em; border-radius:4px; background:rgba(127,127,127,.14);
              font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.86em; word-break:break-all; }
  .txt pre { margin:.7em 0; padding:.8em .9em; border-radius:8px; overflow-x:auto;
             background:var(--code-bg); color:var(--code-fg); }
  .txt pre code { padding:0; background:none; color:inherit; font-size:12.5px; }
  .txt hr { margin:1em 0; border:0; border-top:1px solid var(--line); }
  .txt a { color:var(--info); text-decoration:underline; }
  .txt .tw { overflow-x:auto; margin:.7em 0; }
  .txt table { border-collapse:collapse; font-size:13px; min-width:60%; }
  .txt th,.txt td { border:1px solid var(--line); padding:.4em .7em; text-align:left; }
  .txt th { font-weight:600; background:var(--tool); white-space:nowrap; }
  .txt tr:nth-child(even) td { background:var(--tool-bg); }
  .txt > :first-child { margin-top:0; } .txt > :last-child { margin-bottom:0; }
  .msg.user { flex-direction:row-reverse; }
  .msg.user .av { background:var(--accent); color:var(--accent-fg); }
  .msg.user .body { max-width:78%; }
  .msg.user .who { text-align:right; }
  .msg.user .txt { background:var(--accent); color:var(--accent-fg); border-radius:16px 16px 4px 16px;
                   padding:10px 14px; box-shadow:var(--shadow-lg); }

  /* 工具行 / 折叠组 / 状态条: 柔和小卡片, 紫点表示"智能体在动" */
  .tool { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);
          padding:5px 4px; margin:2px 0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .tool .dot { width:6px; height:6px; border-radius:50%; background:var(--agent); flex:none; }
  .tool.done .dot { background:var(--ok); }
  .toolbox { margin:8px 0; border:1px solid var(--line-soft); border-radius:10px;
             background:var(--tool-bg); overflow:hidden; }
  .toolbox .th { display:flex; align-items:center; gap:8px; width:100%; text-align:left;
                 font-size:12.5px; color:var(--muted); background:transparent; box-shadow:none;
                 border:0; border-radius:0; padding:8px 12px; height:auto; cursor:pointer; }
  .toolbox .th:hover { background:var(--tool); color:var(--fg); }
  .toolbox .th .dot { width:6px; height:6px; border-radius:50%; background:var(--agent); flex:none; }
  .toolbox .sum { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toolbox .chev { width:14px; height:14px; flex:none; opacity:.5; transition:transform .15s; }
  .toolbox.open .chev { transform:rotate(180deg); }
  .toolbox .tl { display:none; padding:6px 12px 8px 14px; border-top:1px solid var(--line-soft); }
  .toolbox.open .tl { display:block; }
  .statusbar { display:flex; align-items:center; gap:8px; margin:10px 0 2px;
               padding:8px 12px; border-radius:10px; background:var(--tool-bg);
               border:1px solid var(--line-soft); font-size:12.5px; color:var(--muted); }
  .statusbar .dot { width:7px; height:7px; border-radius:50%; background:var(--agent);
                    flex:none; animation:sbpulse 1.1s ease-in-out infinite; }
  @keyframes sbpulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .statusbar .who { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:0; }
  .statusbar .el { flex:none; font-variant-numeric:tabular-nums; opacity:.75; }
  .msg.bot.running .body { border-left:2px solid var(--agent); padding-left:10px; }
  .msg.bot.running .who::after { content:' · 工作中'; color:var(--agent); }
  .shot { max-width:100%; border-radius:10px; border:1px solid var(--line); margin:6px 0; }
  .err { color:var(--err); }

  /* 输入区: 悬浮白卡片 (照落地页那个大圆角输入框) */
  footer { padding:10px 20px 14px; flex:none; background:linear-gradient(to bottom, transparent, var(--bg) 40%); }
  .composer { max-width:860px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
              background:var(--card); border:1px solid var(--line); border-radius:16px;
              padding:8px 8px 8px 14px; box-shadow:var(--shadow-lg); }
  .composer:focus-within { border-color:#a8a198; box-shadow:0 0 0 3px rgba(127,116,99,.08), var(--shadow-lg); }
  textarea { flex:1; resize:none; font:inherit; color:var(--fg); background:transparent;
             border:0; padding:8px 0; min-height:38px; max-height:200px; line-height:1.6; }
  textarea:focus { outline:none; }
  textarea::placeholder { color:var(--faint); }
  #send { height:36px; padding:0 16px; border-radius:11px; background:var(--accent);
          color:var(--accent-fg); border-color:transparent; font-weight:600; box-shadow:none; }
  #send:hover:not([disabled]) { background:var(--accent-hover); color:var(--accent-fg); }
  #send[disabled] { opacity:.45; cursor:default; }
  .hint { max-width:860px; margin:8px auto 0; font-size:12px; color:var(--faint); text-align:center; }

  /* 弹层 */
  dialog { border:1px solid var(--line); border-radius:16px; background:var(--card);
           color:var(--fg); padding:18px 20px; min-width:300px; box-shadow:var(--shadow-lg); }
  dialog::backdrop { background:rgba(35,32,27,.35); }
  dialog h3 { margin:0 0 10px; font-size:15px; font-weight:600; }
  dialog label { display:flex; align-items:center; gap:8px; padding:6px 0; cursor:pointer; font-size:14px; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  dialog .row button:last-child { background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:600; }
  /* 团队选单: 卡片栅格, 每张 = emoji + 名字 + 一句话 + 成员头像串 */
  #teamDlg { width:min(880px,94vw); padding:16px 18px; }
  .teams { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; max-height:min(560px,70vh); overflow:auto; padding:2px; }
  .tcard { text-align:left; height:auto; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card);
           display:flex; flex-direction:column; gap:6px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s, transform .15s; }
  .tcard:hover { border-color:#cfcbc4; box-shadow:0 5px 18px rgba(43,38,31,.065); transform:translateY(-1px); }
  .tcard .tn { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--fg); }
  .tcard .tn .em { font-size:18px; }
  .tcard .tn .mode { margin-left:auto; font-size:11px; font-weight:500; color:var(--faint); border:1px solid var(--line); border-radius:999px; padding:1px 7px; }
  .tcard .tg { font-size:12.5px; color:var(--muted); line-height:1.5; }
  .tcard .tm { font-size:12px; color:var(--faint); }
  /* 房间项右侧的删除键: 悬停才出现, 别在列表里摆一排 × */
  .room .del { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:22px; height:22px; padding:0;
               border:0; border-radius:6px; background:transparent; color:var(--side-muted); font-size:14px; line-height:22px;
               opacity:0; box-shadow:none; }
  .room:hover .del, .room.on .del { opacity:1; }
  .room .del:hover { background:rgba(255,255,255,.12); color:#fff; }
  @media (hover:none) { .room .del { opacity:1; } }
  /* 成员 chip 的 ×: 移出成员 (口袋专家口径: 专家本身还在, 只是不在这个群) */
  .chip .x { margin-left:6px; opacity:.45; cursor:pointer; font-size:13px; line-height:1; }
  .chip .x:hover { opacity:1; color:var(--err); }
  /* 文件面板: 左列表右预览。产物落成文件是这个产品的立足点, 用户得看得见、点得开。 */
  #filesDlg { width:min(960px,94vw); height:min(640px,88vh); padding:16px 18px; }
  #filesDlg h3 { display:flex; align-items:baseline; gap:8px; }
  #filesDlg .crumb { font-weight:400; color:var(--muted); font-size:13px; font-family:ui-monospace,monospace; }
  #filesDlg .where { margin-left:auto; font-weight:400; color:var(--faint); font-size:12px; }
  .fbody { display:flex; gap:14px; height:calc(100% - 80px); }
  #fileList { width:300px; flex:none; overflow:auto; border-right:1px solid var(--line-soft); padding-right:10px; }
  #filePreview { flex:1; min-width:0; overflow:auto; display:flex; flex-direction:column;
                 align-items:center; justify-content:center; gap:10px; background:var(--tool-bg);
                 border:1px solid var(--line-soft); border-radius:12px; padding:12px; }
  #filePreview video, #filePreview img { max-width:100%; max-height:calc(100% - 30px); border-radius:8px; }
  #filePreview pre { align-self:stretch; white-space:pre-wrap; font-size:12.5px; margin:0; overflow:auto;
                     font-family:ui-monospace,Menlo,monospace; }
  #filePreview .dl { font-size:13px; color:var(--info); }
  .frow { display:flex; gap:8px; align-items:center; padding:7px 10px; border-radius:9px; cursor:pointer; font-size:13px; }
  .frow:hover { background:var(--tool); }
  .frow .sz { margin-left:auto; color:var(--faint); font-size:12px; flex:none; font-variant-numeric:tabular-nums; }
  .frow.muted { color:var(--faint); cursor:default; }
  .muted { color:var(--faint); font-size:13px; }

  /* 手机: 侧栏变抽屉 (以前直接 display:none, 连房间都切不了), 输入框 16px 防 iOS 聚焦放大 */
  .backdrop { display:none; position:fixed; inset:0; background:rgba(35,32,27,.4); z-index:19; }
  @media (max-width:720px) {
    aside { position:fixed; left:0; top:0; bottom:0; z-index:20; width:min(84vw,300px);
            transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow-lg); }
    body.nav-open aside { transform:none; }
    body.nav-open .backdrop { display:block; }
    .navbtn { display:inline-flex; align-items:center; justify-content:center; flex:none; }
    header { padding:0 12px; gap:8px; }
    header .title { flex:1; min-width:0; }
    header .sp { display:none; }
    header button, header select { white-space:nowrap; flex:none; padding:0 10px; font-size:12.5px; }
    #model { max-width:120px; text-overflow:ellipsis; }
    #members { display:none; }
    textarea { min-height:44px; }
    .hint { font-size:11px; }
    #log { padding:16px 12px; }
    footer { padding:8px 10px 10px; }
    textarea, select, input { font-size:16px !important; }
    .msg.user .body { max-width:88%; }
    #fileList { width:150px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">🎬</div><div><div class="name">Agents Team</div><div class="sub">多 Agent 群聊</div></div></div>
  <h2>房间</h2>
  <div class="rooms" id="rooms"></div>
  <div class="actions">
    <button id="newTeam">✨ 组个团队</button>
    <button id="newRoom">＋ 拉个群</button>
  </div>
</aside>
<div class="backdrop" id="backdrop"></div>

<main>
  <header>
    <button class="navbtn" id="navBtn" type="button" aria-label="房间">☰</button>
    <span class="title" id="title">—</span>
    <span id="members"></span>
    <span class="sp"></span>
    <select id="model" title="模型"></select>
    <button id="filesBtn" title="这部片的产物">文件</button>
    <button id="edit">成员</button>
  </header>
  <div id="log"><div class="wrap" id="wrap"></div></div>
  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="说一件事，群里的机器人会同时开工。Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint" id="hint">同一轮里成员是同时对你说话，彼此看不到对方这一轮说了什么；再发一轮它们就能接上话。</div>
  </footer>
</main>

<dialog id="filesDlg">
  <h3>文件 <span class="crumb" id="fileCrumb">/</span><span class="where" id="fileWhere"></span></h3>
  <div class="fbody">
    <div id="fileList"></div>
    <div id="filePreview"><div class="muted">点左边的文件预览；视频直接播</div></div>
  </div>
  <div class="row"><button id="filesRefresh">刷新</button><button id="filesClose">关闭</button></div>
</dialog>

<dialog id="teamDlg">
  <h3>组个团队 <span class="where">选一个模板，成员和顺序自动就位</span></h3>
  <div class="teams" id="teamList"></div>
  <div class="row"><button id="teamCancel">取消</button></div>
</dialog>

<dialog id="picker">
  <h3 id="pickTitle">选成员</h3>
  <div id="pickList"></div>
  <div class="row"><button id="pickCancel">取消</button><button id="pickOk">确定</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const wrap = $('wrap'), log = $('log'), input = $('input'), send = $('send');
const DEFAULT_HINT = $('hint').textContent;
let BOTS = {}, ROOMS = [], cur = null, busy = false;

const at = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
const scroll = f => { if (f || at()) log.scrollTop = log.scrollHeight; };
const botOf = id => BOTS[id] || { name: id, emoji: '🤖' };

// ── 轻量 Markdown 渲染 (照 AgentsDance 的 MarkdownText 搬, 零依赖) ──────────
// 覆盖 LLM 常用子集: 标题/有序·无序列表/加粗·斜体·行内代码/链接/引用/分割线/
// 代码块/表格/段落。**可对流式增量文本反复渲染** —— 每来一块就整份重渲, 因为
// 函数是纯的且便宜; 增量拼 HTML 反而会在标记跨块断开时渲染出半截标签。
//
// ⚠️ React 那边自动转义, 原生这边**必须自己先转义再拼 HTML** —— 机器人的输出
// 里出现 <script> 或 <img onerror> 就是 XSS, 而它的输出我们控制不了。
// 所以: 一切进入 innerHTML 的文本, 都先过 esc()。
function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 行内: `代码` **粗** [文字](链接) *斜* —— 输入已转义, 这里只认标记
function mdInline(t) {
  let h = esc(t);
  h = h.replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
  h = h.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
  // 链接只放行 http(s): —— javascript: 伪协议是另一条 XSS 路
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return h;
}

function mdRender(src) {
  const lines = String(src || '').split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    // 代码块 ```lang ... ```  (流式期间可能还没收到闭合行 —— 收到多少渲染多少)
    if (/^\s*```/.test(ln)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (!ln.trim()) { i++; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(ln)) { out.push('<hr>'); i++; continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(ln);
    if (h) {
      const lv = h[1].length;
      out.push('<h' + lv + '>' + mdInline(h[2]) + '</h' + lv + '>');
      i++; continue;
    }
    // 引用块: 连续的 > 行并成一块 (截图里阿导整段发言就是这个形状)
    if (/^\s*>\s?/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      out.push('<blockquote>' + mdRender(buf.join('\n')) + '</blockquote>');
      continue;
    }
    // 表格: 必须有分隔行才算 —— 否则正文里一句带竖线的话会被误吞
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length
        && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(lines[i]);
      i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
      out.push('<div class="tw"><table><thead><tr>'
        + head.map(c => '<th>' + mdInline(c) + '</th>').join('')
        + '</tr></thead><tbody>'
        + body.map(r => '<tr>' + r.map(c => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('')
        + '</tbody></table></div>');
      continue;
    }
    // 有序 / 无序列表
    const ordered = /^\s*\d+[.)]\s+/.test(ln);
    if (ordered || /^\s*[-*+]\s+/.test(ln)) {
      const tag = ordered ? 'ol' : 'ul';
      const re = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
      const items = [];
      while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, ''));
      out.push('<' + tag + '>' + items.map(x => '<li>' + mdInline(x) + '</li>').join('') + '</' + tag + '>');
      continue;
    }
    // 段落: 吃到空行为止, 行内换行保留
    const para = [];
    while (i < lines.length && lines[i].trim()
           && !/^\s*(#{1,6}\s|>|```|[-*+]\s|\d+[.)]\s)/.test(lines[i])
           && !/^\s*(---|\*\*\*|___)\s*$/.test(lines[i])) para.push(lines[i++]);
    if (para.length) out.push('<p>' + mdInline(para.join('\n')).replace(/\n/g, '<br>') + '</p>');
    else i++;
  }
  return out.join('');
}

// 机器人正文一律走 markdown; 用户自己打的字保持原样 (他打什么就是什么)
function setText(el, text, isUser) {
  el.dataset.raw = text || '';
  if (isUser) el.textContent = text || '';
  else el.innerHTML = mdRender(text || '');
}


function msgEl(sender, text) {
  const isUser = sender === 'user', b = botOf(sender);
  const d = document.createElement('div');
  d.className = 'msg ' + (isUser ? 'user' : 'bot');
  d.innerHTML = '<div class="av"></div><div class="body"><div class="who"></div>'
              + '<div class="txt"></div></div>';
  d.querySelector('.av').textContent = isUser ? '🙂' : b.emoji;
  d.querySelector('.who').textContent = isUser ? '你' : b.name;
  setText(d.querySelector('.txt'), text, isUser);
  wrap.appendChild(d); scroll(true);
  return d;
}

// 工具行折叠 (2026-08-31 老板: "屏幕有限, 用户很难捕捉哪个专家正在工作")。
// 一个工位随手就是十几步, 平铺开来能把整屏占满 —— 谁在干活反而看不出来了。
// 收成一行: 「⚙ 第 N 步 · 正在做什么 ⌄」, 点开看全部。跑动中始终露出**最后一行**
// (那才是"此刻在干嘛"), 收尾后自动收起。
// 等待期的状态条 (2026-09-01 老板: "发消息半天不回, 有没有个计数器以及阶段说明")。
// 一部三分钟短剧一棒能跑好几分钟, 而屏幕上此前只有一片静止 —— 用户分不出
// "在干活"还是"死了"。这条一直挂在最底下: 谁在干活 · 干了多久 · 第几棒。
let statusBar = null, statusTimer = null, statusFrom = 0, statusWho = '';
let TEAMS = [];   // /api/teams: 模板表, 选单和提示都从它来 (棒次从 cur.members 推, 不再写死剧组)

function statusStart(label) {
  statusStop();
  statusFrom = Date.now();
  statusWho = '';
  statusBar = document.createElement('div');
  statusBar.className = 'statusbar';
  statusBar.innerHTML = '<span class="dot"></span><span class="who"></span>'
                      + '<span class="el"></span>';
  wrap.appendChild(statusBar);
  statusSet(label);
  statusTimer = setInterval(() => {
    const s = Math.round((Date.now() - statusFrom) / 1000);
    const t = s >= 60 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${s} 秒`;
    statusBar.querySelector('.el').textContent = t;
  }, 1000);
  scroll();
}

function statusSet(label, botId) {
  if (!statusBar) return;
  let txt = label;
  if (botId) {
    // 第几棒 = 在这个房间成员表里的位置; 只在接力房间里有意义 (并行房间不是流水线)
    const order = cur && cur.mode === 'relay' ? cur.members : [];
    const i = order.indexOf(botId);
    const step = i >= 0 ? ` · 第 ${i + 1}/${order.length} 棒` : '';
    txt = `${botOf(botId).emoji} ${botOf(botId).name} 正在${label}${step}`;
    // **只在换人时**重新计时。一棒里要跑十几个工具, 每次工具调用都重置的话
    // 秒数会被反复清零, 永远看不出"这一棒已经跑了多久" —— 而那正是用户要的。
    if (botId !== statusWho) { statusFrom = Date.now(); statusWho = botId; }
  }
  statusBar.querySelector('.who').textContent = txt;
}

function statusStop() {
  if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
  if (statusBar && statusBar.parentNode) statusBar.parentNode.removeChild(statusBar);
  statusBar = null;
}

function toolBox(container) {
  let box = container.querySelector(':scope > .toolbox');
  if (box) return box;
  box = document.createElement('div');
  box.className = 'toolbox';
  box.innerHTML = '<button class="th" type="button">'
                + '<span class="dot"></span><span class="sum"></span>'
                + '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
                + ' stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>'
                + '<div class="tl"></div>';
  box.querySelector('.th').onclick = () => {
    box.classList.toggle('open');
    if (box.classList.contains('open')) scroll();
  };
  container.appendChild(box);
  return box;
}

function toolRow(container, label) {
  const box = toolBox(container);
  const list = box.querySelector('.tl');
  const t = document.createElement('div');
  t.className = 'tool';
  t.innerHTML = '<span class="dot"></span><span class="t"></span>';
  t.querySelector('.t').textContent = label;
  list.appendChild(t);
  syncToolSummary(box);
  scroll();
  return t;
}

// 摘要永远反映**最后一行** —— 用户要的是"此刻在干嘛", 不是"一共干了多少"
function syncToolSummary(box) {
  const rows = box.querySelectorAll('.tl > .tool');
  const last = rows[rows.length - 1];
  const n = rows.length;
  box.querySelector('.sum').textContent =
    (last ? last.querySelector('.t').textContent : '') + (n > 1 ? ` · ${n} 步` : '');
}

// 退避探活: 容器被回收后要几十秒才重建好, 一次失败就放弃等于白重连。
async function waitForBackend(tries) {
  for (let i = 0; i < tries; i++) {
    await new Promise(r => setTimeout(r, Math.min(1000 * 2 ** i, 8000)));
    try {
      const r = await fetch('/api/rooms', { credentials: 'same-origin' });
      if (r.ok) return true;
    } catch (e) { /* 还没起来, 接着等 */ }
  }
  return false;
}

async function api(path, opt) {
  const r = await fetch(path, opt);
  return r.json();
}

async function loadRooms(select) {
  const d = await api('/api/rooms');
  ROOMS = d.rooms;
  $('rooms').innerHTML = '';
  ROOMS.forEach(r => {
    const el = document.createElement('div');
    el.className = 'room' + (r.id === (cur && cur.id) ? ' on' : '');
    el.innerHTML = '<div class="n"></div><div class="l"></div><button class="del" type="button" title="删除这个群">×</button>';
    el.querySelector('.n').textContent =
      r.members.map(m => botOf(m).emoji).join('') + ' ' + r.name;
    el.querySelector('.del').onclick = async e => {
      e.stopPropagation();
      if (!confirm(`删除「${r.name}」？聊天记录一起删；文件面板里的产物留在磁盘上。`)) return;
      const d = await api('/api/rooms/' + r.id, { method: 'DELETE' });
      if (d.ok) { if (cur && cur.id === r.id) cur = null; await loadRooms(); }
      else alert(d.detail || d.error || '删除失败');
    };
    // 第二行带上消息数 —— 房间重名时这是唯一分得出"哪个是我刚才那个"的线索
    const n = r.count || 0;
    el.querySelector('.l').textContent =
      (n ? `${n} 条 · ` : '') + (r.last || '还没说过话');
    el.onclick = () => open(r);
    $('rooms').appendChild(el);
  });
  if (select && ROOMS.length) open(ROOMS.find(r => r.id === select) || ROOMS[0]);
  else if (!cur && ROOMS.length) open(ROOMS[0]);
  else if (!ROOMS.length) { cur = null; $('title').textContent = '—'; $('members').innerHTML = ''; wrap.innerHTML = ''; }
}

//: 底栏提示按房间模式生成。默认那句是并行模式的 ("同时对你说话, 彼此看不到") ——
//: 挂在接力房间下面正好说反了, 接力是后一棒看得见前一棒刚交的活。顺序从成员表来。
function hintFor(room) {
  if (room.mode === 'relay' && room.members.length) {
    return '按顺序接力：' + room.members.map(m => botOf(m).name).join(' → ')
         + '，每一棒都看得见前一棒刚交的活。停在哪一棒，说「继续」就从那一棒接着跑。';
  }
  return DEFAULT_HINT;
}

$('navBtn').onclick = () => document.body.classList.toggle('nav-open');
// 窄屏上那句长占位文案会被裁成两行半, 换短的 (placeholder 改不了样式, 只能改字)
if (matchMedia('(max-width:720px)').matches) input.placeholder = '说一件事，团队开工';
$('backdrop').onclick = () => document.body.classList.remove('nav-open');

async function open(room) {
  cur = room;
  document.body.classList.remove('nav-open');   // 手机上选完房间收起抽屉
  $('title').textContent = room.name;
  $('hint').textContent = hintFor(room);
  $('members').innerHTML = '';
  room.members.forEach(m => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = botOf(m).emoji + ' ' + botOf(m).name;
    if (room.members.length > 1) {
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '×'; x.title = '移出 ' + botOf(m).name;
      x.onclick = async e => {
        e.stopPropagation();
        if (!confirm(`把 ${botOf(m).name} 移出「${room.name}」？他本人还在花名册里，只是不在这个群。`)) return;
        const d = await api('/api/rooms/' + room.id + '/members/' + m, { method: 'DELETE' });
        if (d.room) { cur = d.room; await loadRooms(d.room.id); }
        else alert(d.detail || d.error || '移出失败');
      };
      c.appendChild(x);
    }
    $('members').appendChild(c);
  });
  wrap.innerHTML = '';
  const d = await api('/api/rooms/' + room.id + '/messages');
  d.messages.forEach(m => {
    const el = msgEl(m.sender, m.text);
    (m.tools || []).forEach(s => {
      const t = toolRow(el.querySelector('.body'), s); t.classList.add('done');
      syncToolSummary(t.closest('.toolbox'));
    });
  });
  Array.from($('rooms').children).forEach((el, i) =>
    el.classList.toggle('on', ROOMS[i].id === room.id));
  scroll(true);
}

async function submit() {
  const text = input.value.trim();
  if (!text || busy || !cur) return;
  busy = true; send.disabled = true;
  msgEl('user', text);
  // ⚠️ 发之前先确认后端还在。容器被回收/换版之后, 浏览器手里那条连接是死的,
  // fetch 会直接失败 —— 而失败发生在 SSE 循环**之前**, 于是屏幕上只留一条
  // 自己的消息, 什么都不发生 (2026-09-01 老板: "怎么回事, 没了呢")。
  // 探活便宜 (一个 GET), 换来的是"说得出为什么"。
  try {
    const ping = await fetch('/api/rooms', { credentials: 'same-origin' });
    if (!ping.ok) throw new Error('HTTP ' + ping.status);
  } catch (e) {
    const el = msgEl('system', '云电脑连接断了 — 正在重连…');
    el.querySelector('.txt').classList.add('err');
    const ok = await waitForBackend(6);
    setText(el.querySelector('.txt'),
            ok ? '连接已恢复, 请再发一次。' : '连接没能恢复 — 刷新页面会重新开机, 文件和进度都在。',
            false);
    if (ok) el.querySelector('.txt').classList.remove('err');
    busy = false; send.disabled = false; input.focus();
    return;
  }
  statusStart('已发出, 等第一个工位开口…');
  input.value = ''; input.style.height = 'auto';

  // 几个机器人同时说话 —— 每个各自一个气泡, 按 bot id 归位。
  // 用一个 map 而不是"最后一个气泡": 并行时事件是交错到达的, 追加到最后一个
  // 气泡会把甲的话接到乙嘴里。
  const bubbles = new Map(), tools = new Map();
  const bubbleFor = id => {
    if (!bubbles.has(id)) bubbles.set(id, msgEl(id, ''));
    const el = bubbles.get(id);
    // 谁在工作要一眼看得出: 只有**最新出现**的那位挂 running, 前面的摘掉。
    // 接力模式下这就等于"当前这一棒是谁" —— 屏幕有限, 这比堆一屏工具行有用。
    if (!el.classList.contains('running')) {
      wrap.querySelectorAll('.msg.bot.running').forEach(x => x.classList.remove('running'));
      el.classList.add('running');
    }
    return el;
  };
  try {
    const r = await fetch('/api/rooms/' + cur.id + '/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, model: $('model').value || null }),
    });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE 以空行分帧。**必须按帧切**而不是按行读: 一个 chunk 里可能有半帧,
      // 按行读会把半个 JSON 交给 parse, 整个界面卡死在那一条上。
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!frame.startsWith('data: ')) continue;
        const ev = JSON.parse(frame.slice(6));
        const body = ev.bot ? bubbleFor(ev.bot).querySelector('.body') : null;
        if (ev.type === 'text') {
          {
            statusSet('说话', ev.bot);
            const el = bubbleFor(ev.bot).querySelector('.txt');
            setText(el, (el.dataset.raw || '') + ev.text, false);
            scroll();
          }
        } else if (ev.type === 'tool') {
          statusSet(ev.name, ev.bot);
          tools.set(ev.bot + ':' + ev.id, toolRow(body, '正在' + ev.name));
        } else if (ev.type === 'result') {
          const t = tools.get(ev.bot + ':' + ev.id);
          if (t) { t.classList.add('done'); t.querySelector('.t').textContent = ev.summary; }
        } else if (ev.type === 'progress') {
          // 长工具的心跳 (出片一条几分钟): 工具行原地改写 + 状态条跟着走。
          // 不新起一行 —— 每 6 秒一条会把工具组刷成一屏噪音。
          const t = tools.get(ev.bot + ':' + ev.id);
          if (t) {
            t.querySelector('.t').textContent = ev.text;
            const box = t.closest('.toolbox');
            if (box) syncToolSummary(box);
          }
          statusSet(ev.text, ev.bot);
        } else if (ev.type === 'image') {
          const img = document.createElement('img');
          img.className = 'shot'; img.src = ev.data_uri; body.appendChild(img); scroll();
        } else if (ev.type === 'end') {
          // 这一棒交了 —— 摘掉工作中标记, 工具组收起 (跑完了就不该再占屏)
          const done = bubbles.get(ev.bot);
          if (done) {
            done.classList.remove('running');
            done.querySelectorAll('.toolbox.open').forEach(b => b.classList.remove('open'));
          }
          if (ev.note) $('hint').textContent = ev.note;
        } else if (ev.type === 'error') {
          const el = ev.bot ? bubbleFor(ev.bot) : msgEl('system', '');
          el.querySelector('.txt').textContent += (ev.message || '出错了');
          el.querySelector('.txt').classList.add('err');
        }
      }
    }
  } catch (e) {
    // 断流不是终点 (2026-09-01): 容器被回收/网络抖动都会把 SSE 掐断, 而**接力
    // 状态在服务端**(room.resume_at) —— 重连后发一句"继续"就从原地接着跑。
    // 原先只留一行红字, 用户面对的是一条死掉的流水线, 只能自己猜要不要重发。
    // 与口袋专家那边同一个教训: 自动重连必须真的存在, 不能只在错误里说一句。
    const el = msgEl('system', '连接中断: ' + e.message + ' — 正在重连…');
    el.querySelector('.txt').classList.add('err');
    const ok = await waitForBackend(6);
    if (ok) {
      setText(el.querySelector('.txt'),
              '连接已恢复。工作台还在跑 — 回一句「继续」就从中断处接着干。', false);
      el.querySelector('.txt').classList.remove('err');
      await loadRooms(cur.id);
    } else {
      setText(el.querySelector('.txt'),
              '连接中断且重连未成功。云电脑可能已回收 — 刷新页面会重新开机, 文件和进度都在。', false);
    }
  } finally {
    statusStop();
    busy = false; send.disabled = false; input.focus();
    loadRooms(cur.id);
    if ($('filesDlg').open) loadFiles(fdir);   // 刚出的产物立刻出现在面板里
  }
}

// --- 文件面板 -------------------------------------------------------------
// 群里说"成片在 片/xxx/成片.mp4"是真的, 但以前页面上没有任何地方能看到它 ——
// 2026-09-02 老板验收第一句: "生成的内容在哪呢"。
let fdir = '';
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n > 1024 ? (n / 1024 | 0) + ' KB' : n + ' B';
const fileIcon = k => ({ video: '🎬 ', image: '🖼 ', text: '📄 ' }[k] || '📎 ');
const rawUrl = e => '/api/rooms/' + cur.id + '/files/raw?path=' + encodeURIComponent(e.path);
function frow(label, right) {
  const el = document.createElement('div'); el.className = 'frow';
  const a = document.createElement('span'); a.textContent = label; el.appendChild(a);
  if (right) { const b = document.createElement('span'); b.className = 'sz'; b.textContent = right; el.appendChild(b); }
  return el;
}
async function loadFiles(rel) {
  if (!cur) return;
  fdir = rel || '';
  $('fileWhere').textContent = cur.dir ? '这部片的目录: ' + cur.dir : '工作区根目录 (老房间)';
  let d;
  try { d = await api('/api/rooms/' + cur.id + '/files?path=' + encodeURIComponent(fdir)); }
  catch (e) { $('fileList').textContent = '读不到目录: ' + e; return; }
  $('fileCrumb').textContent = '/' + (d.dir || '');
  const list = $('fileList'); list.innerHTML = '';
  if (d.dir) {
    const up = frow('⬆︎ 上一级', ''); up.onclick = () => loadFiles(d.dir.split('/').slice(0, -1).join('/'));
    list.appendChild(up);
  }
  if (!d.entries.length) {
    const e = frow('这里还是空的 — 团队开工后产物会出现在这里', ''); e.classList.add('muted'); list.appendChild(e);
  }
  d.entries.forEach(e => {
    const el = frow((e.dir ? '📁 ' : fileIcon(e.kind)) + e.name, e.dir ? '' : fmtSize(e.size));
    el.onclick = () => e.dir ? loadFiles(e.path) : preview(e);
    list.appendChild(el);
  });
}
async function preview(e) {
  const pv = $('filePreview'); pv.innerHTML = '';
  if (e.kind === 'video') {
    const v = document.createElement('video'); v.controls = true; v.autoplay = true; v.src = rawUrl(e); pv.appendChild(v);
  } else if (e.kind === 'image') {
    const i = document.createElement('img'); i.src = rawUrl(e); i.alt = e.name; pv.appendChild(i);
  } else if (e.kind === 'text' && e.size < 400000) {
    const r = await fetch(rawUrl(e)); const pre = document.createElement('pre'); pre.textContent = await r.text(); pv.appendChild(pre);
  } else {
    const m = document.createElement('div'); m.className = 'muted'; m.textContent = e.name + ' (' + fmtSize(e.size) + ')'; pv.appendChild(m);
  }
  const dl = document.createElement('a'); dl.href = rawUrl(e); dl.download = e.name; dl.className = 'dl'; dl.textContent = '⬇ 下载 ' + e.name;
  pv.appendChild(dl);
}
$('filesBtn').onclick = () => { $('filesDlg').showModal(); loadFiles(''); };
$('filesClose').onclick = () => { $('filePreview').innerHTML = ''; $('filesDlg').close(); };
$('filesRefresh').onclick = () => loadFiles(fdir);

// --- 成员选择 (拉群 / 改成员共用) -------------------------------------------
function pick(title, checked) {
  return new Promise(resolve => {
    $('pickTitle').textContent = title;
    $('pickList').innerHTML = '';
    Object.values(BOTS).forEach(b => {
      const l = document.createElement('label');
      l.innerHTML = '<input type="checkbox" value="' + b.id + '">'
                  + '<span>' + b.emoji + ' ' + b.name + '</span>';
      l.querySelector('input').checked = checked.includes(b.id);
      $('pickList').appendChild(l);
    });
    const dlg = $('picker');
    const done = v => { dlg.close(); resolve(v); };
    $('pickOk').onclick = () => done(
      Array.from($('pickList').querySelectorAll('input:checked')).map(i => i.value));
    $('pickCancel').onclick = () => done(null);
    dlg.showModal();
  });
}

$('newRoom').onclick = async () => {
  const m = await pick('拉谁进群？', []);
  if (!m || !m.length) return;
  const d = await api('/api/rooms', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ members: m }),
  });
  if (d.room) { cur = d.room; await loadRooms(d.room.id); }
};

// 组个团队: 选一个模板, 成员和接力顺序自动就位 —— 用户提一个想法就该开工, 不该先
// 手工拉五个人, 更不该自己记住谁先谁后。剧组只是十个模板中的一个。
// 名字自动生成「新<团队> N · 09-01 16:52」: 几个房间在侧栏里长得一模一样时, 序号 +
// 时间是唯一分得出"哪个是我刚才那个"的线索 (2026-09-01 老板实测)。
function pickTeam() {
  return new Promise(resolve => {
    const list = $('teamList'); list.innerHTML = '';
    TEAMS.forEach(t => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'tcard';
      b.innerHTML = '<div class="tn"><span class="em"></span><span class="nm"></span><span class="mode"></span></div>'
                  + '<div class="tg"></div><div class="tm"></div>';
      b.querySelector('.em').textContent = t.emoji;
      b.querySelector('.nm').textContent = t.name;
      b.querySelector('.mode').textContent = t.mode === 'relay' ? '接力' : '并行';
      b.querySelector('.tg').textContent = t.tagline;
      b.querySelector('.tm').textContent = t.members.map(m => m.emoji + ' ' + m.name).join(' · ');
      b.onclick = () => { $('teamDlg').close(); resolve(t); };
      list.appendChild(b);
    });
    $('teamCancel').onclick = () => { $('teamDlg').close(); resolve(null); };
    $('teamDlg').showModal();
  });
}
$('newTeam').onclick = async () => {
  const t = await pickTeam();
  if (!t) return;
  const n = ROOMS.filter(r => r.team === t.id).length + 1;
  const d = new Date(), pad = x => String(x).padStart(2, '0');
  const name = `新${t.name} ${n} · ${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const r = await api('/api/rooms/team', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team: t.id, name }),
  });
  if (r.room) { cur = r.room; await loadRooms(r.room.id); }
  else alert(r.detail || r.error || '建群失败');
};

$('edit').onclick = async () => {
  if (!cur) return;
  const m = await pick('群成员', cur.members);
  if (!m) return;
  const d = await api('/api/rooms/' + cur.id + '/members', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ members: m }),
  });
  if (d.room) { cur = d.room; await loadRooms(d.room.id); }
};

send.onclick = submit;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

(async function boot() {
  const b = await api('/api/bots');
  b.bots.forEach(x => BOTS[x.id] = x);
  try { TEAMS = (await api('/api/teams')).teams || []; } catch (e) { TEAMS = []; }
  try {
    const m = await api('/api/models');
    m.models.forEach(id => {
      const o = document.createElement('option');
      o.value = id; o.textContent = id;
      if (id === m.default) o.selected = true;
      $('model').appendChild(o);
    });
  } catch { /* 模型列表拿不到不该挡住聊天, 后端会用默认模型 */ }
  await loadRooms();
})();
</script>
<script>
// 工作台守护层 —— 所有产品共用, 由服务端注入进工作台文档 (见 _guard_inject)。
//
// 干两件事:
//
// ① **心跳**。回收判据原先靠"请求流量"当在场信号 (Caddy 的 forward_auth 会为
//    页面上每个资源打一次 /api/work/route)。但流量治不了**长连接**: 一条挂着
//    几分钟的 SSE 期间, 页面一个新请求都不发 —— 看起来就跟标签页关了一模一样。
//    2026-09-01 老板守着浏览器看剧组跑片, 容器被判 "tab closed" 收掉, 屏幕上
//    只留一句 "Load failed"。心跳是主动的, 不受连接形态影响。
//
// ② **回收前弹窗**。判据总有失灵的时候 (那次就是 agent 活动信号传错了键,
//    一直读到 0), 而代价是用户正干着的活当场没了。所以服务端改成"先挂牌再等",
//    这里把牌子变成一个看得见的确认框: 120 秒倒计时, 点「继续用」就摘牌。
//
// 页面不可见时不发心跳 —— 那时本来就该按空闲计。切回来立刻补一发, 否则用户
// 回到标签页的头几秒里仍可能被收掉。
(function () {
  'use strict';
  if (window.__dshGuard) return;          // 注入两次也只跑一份
  window.__dshGuard = true;

  var HEARTBEAT_MS = 45000;               // 远小于最短宽限 (3 分钟), 留足余量
  var POLL_MS = 15000;                    // 挂牌到弹窗之间最多晚 15 秒
  var box = null, timer = null, left = 0;

  function post(path) {
    return fetch(path, { method: 'POST', credentials: 'same-origin' }).catch(function () {});
  }

  function beat() {
    if (document.visibilityState === 'hidden') return;
    post('/api/work/heartbeat');
  }

  function close() {
    if (timer) { clearInterval(timer); timer = null; }
    if (box && box.parentNode) box.parentNode.removeChild(box);
    box = null;
  }

  function keep() {
    close();
    post('/api/work/keep').then(beat);
  }

  // 弹窗自带全部样式并挂在 <body> 末尾 —— 宿主是 Dify/Coze/ComfyUI 这些第三方
  // 界面, 不能假设它们有任何 CSS 框架, 也不能污染它们的类名。
  function open(seconds) {
    if (box) return;
    left = seconds;
    box = document.createElement('div');
    box.setAttribute('style', [
      'position:fixed', 'inset:0', 'z-index:2147483647',
      'display:flex', 'align-items:center', 'justify-content:center',
      'background:rgba(0,0,0,.45)',
      'font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
    ].join(';'));
    box.innerHTML =
      '<div style="max-width:380px;margin:16px;padding:22px 24px;border-radius:14px;' +
      'background:#fff;color:#1a1a1a;box-shadow:0 18px 48px rgba(0,0,0,.28)">' +
      '<div style="font-size:16px;font-weight:600;margin-bottom:8px">这台云电脑还在用吗？</div>' +
      '<div style="color:#555;margin-bottom:6px">看起来闲了一会儿。' +
      '<b id="dsh-guard-n"></b> 秒后会自动回收以省下机时。</div>' +
      '<div style="color:#888;font-size:12.5px;margin-bottom:18px">' +
      '回收只是关机 —— 文件都在, 下次打开还能接着用。</div>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end">' +
      '<button id="dsh-guard-stop" style="padding:8px 14px;border-radius:9px;border:1px solid #ddd;' +
      'background:#fff;color:#555;cursor:pointer">现在就收</button>' +
      '<button id="dsh-guard-keep" style="padding:8px 16px;border-radius:9px;border:0;' +
      'background:#4c6ef5;color:#fff;font-weight:600;cursor:pointer">继续用</button>' +
      '</div></div>';
    document.body.appendChild(box);
    var n = box.querySelector('#dsh-guard-n');
    n.textContent = left;
    box.querySelector('#dsh-guard-keep').onclick = keep;
    // 「现在就收」不主动调停止端点 —— 让它自然走完倒计时即可, 少一条能误伤的路径
    box.querySelector('#dsh-guard-stop').onclick = close;
    timer = setInterval(function () {
      left -= 1;
      if (left <= 0) { close(); return; }
      n.textContent = left;
    }, 1000);
  }

  function poll() {
    fetch('/api/work/reclaim', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s && s.asking) open(s.seconds_left || 0);
        else close();                     // 服务端摘牌了 (比如别处有了活动)
      })
      .catch(function () {});
  }

  beat();
  poll();
  setInterval(beat, HEARTBEAT_MS);
  setInterval(poll, POLL_MS);
  // 切回标签页立刻补一发 —— 否则回来的头几秒里仍可能被收掉
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { beat(); poll(); }
  });
})();

</script>
