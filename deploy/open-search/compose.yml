# dshcloud.online deployment — DHC server + scoped docker proxy (cloud workspaces).
# (Directory keeps its historical "open-search" name: the compose project name —
#  and therefore the data volume open-search_dhc-data — derives from it.)
#
# The host's 80/443 and the domains' TLS/Cloudflare origin are already owned
# by the existing the shared Caddy. So we do NOT run our own Caddy here:
# we run the app on shared docker networks, connect that Caddy to them, and
# point the dshcloud.online / work.dshcloud.online site blocks at us
# (legacy open-search.ai keeps /api /llm /releases passthrough + page redirects).
#
#   docker network create dhc-net 2>/dev/null || true
#   docker network create dshwork-net 2>/dev/null || true
#   docker compose -f deploy/open-search/compose.yml --env-file deploy/open-search/.env up -d --build
#   bash deploy/open-search/cutover.sh   # idempotent: networks + caddy blocks
services:
  # Our own instance: the host also runs an unrelated postgres for a different
  # stack, and sharing it would couple two products' upgrade windows.
  dhc-postgres:
    image: postgres:18-alpine
    container_name: dhc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dshcloud}
      POSTGRES_USER: ${POSTGRES_USER:-dshcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # postgres:18+ expects the mount at /var/lib/postgresql (not .../data),
      # so a future pg_upgrade --link does not cross a mount boundary.
      - dhc-pgdata:/var/lib/postgresql
    networks: [dhc-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dshcloud} -d ${POSTGRES_DB:-dshcloud}"]
      interval: 10s
      timeout: 5s
      retries: 10

  dhc-server:
    # Access logs are named in the privacy policy with a retention figure, and
    # the default json-file driver keeps them forever — the stated period has to
    # be enforced by something. 5 x 20MB is roughly a quarter at current volume.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: dhc-server:latest
    container_name: dhc-server
    restart: unless-stopped
    env_file: [".env"]
    environment:
      DHC_DATA_DIR: /app/data
      # Where the per-user workspace volumes are mounted below. Lets 個人成品
      # list and open a user's files while their container is asleep, which is
      # most of the time.
      WORK_VOLUME_ROOT: /hostvolumes
    volumes:
      - dhc-data:/app/data
      # Read-only, and no new authority: dhc-server already drives container
      # creation through the socket proxy, which can bind-mount anything.
      # The path is the HOST's docker volume root and differs per machine —
      #   docker info -f '{{.DockerRootDir}}'
      # is /mnt/docker here and /var/lib/docker on a default install. Wrong path
      # = 個人成品 silently empty, so it comes from .env and is checked at boot.
      - ${DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}:/hostvolumes:ro
    networks:
      - dhc-net
      - dshwork-net    # reach per-user dsh containers for readiness probes
    expose:
      - "8100"
    depends_on:
      dhc-docker-proxy:
        condition: service_started
      dhc-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Scoped docker socket: dhc-server manages ONLY containers/networks, never the
  # raw socket. POST enabled so it can create/start/stop; exec/volumes denied.
  dhc-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: dhc-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      INFO: 1
      POST: 1
      EXEC: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dhc-net

networks:
  dhc-net:
    external: true
    name: dhc-net
  dshwork-net:
    external: true
    name: dshwork-net

volumes:
  dhc-data:
  dhc-pgdata:
