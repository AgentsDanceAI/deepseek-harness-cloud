<!doctype html>
<meta charset="utf-8">
<title>AI Store</title>
<style>
  :root { color-scheme: light dark; --line:#e5e9f0; --muted:#6b7280; --accent:#5d7bf9; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --line:#2a2f3a; --muted:#8b93a1; } }
  body { margin:0; font:14px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { padding:22px 26px 10px; }
  h1 { margin:0; font-size:19px; }
  .lede { margin:6px 0 0; color:var(--muted); }
  .banner { margin:14px 26px 0; padding:11px 14px; border:1px solid var(--line); border-radius:9px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px; padding:16px 26px 30px; }
  .card { border:1px solid var(--line); border-radius:11px; padding:13px 15px; display:flex; flex-direction:column; gap:7px; }
  .name { font-weight:600; }
  .why { color:var(--muted); font-size:12.5px; min-height:1.4em; }
  .row { display:flex; gap:8px; align-items:center; margin-top:2px; }
  button { font:inherit; padding:5px 13px; border-radius:7px; border:1px solid var(--line); background:transparent; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button[disabled] { opacity:.45; cursor:default; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; }
  .log { font:11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--muted);
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>

<header>
  <h1>本机工作台</h1>
  <p class="lede">跑在这台机器上，不占云端机时。账号、模型网关和计费仍走 AI Store。</p>
</header>
<div id="banner" class="banner" hidden></div>
<div id="grid" class="grid"></div>

<script>
  const grid = document.getElementById('grid')
  const banner = document.getElementById('banner')

  /** 每一格的**临时**状态: 正在启动、上一次的错误、最近一行日志。
   *  单独存一份是因为下面 15 秒一次的轮询会整片重画卡片 —— 状态放在 DOM 上,
   *  用户点完看到一行错误, 十几秒后它自己消失, 看起来像"什么都没发生"。 */
  const ui = new Map()
  const uiOf = id => ui.get(id) ?? {}
  const setUi = (id, patch) => { ui.set(id, { ...uiOf(id), ...patch }); render() }

  let latest = { docker: false, products: [] }

  window.aiStoreShelf.onProgress(({ id, line }) => { setUi(id, { log: line }) })

  function card(p) {
    const st = uiOf(p.id)
    const live = typeof p.port_local === 'number'
    // 「起不动」和「没买」是两件事: 11 个容器的栈, 买了通行证照样起不动。
    const runnable = p.runnable === 'ready' && !p.locked
    const why = st.error
      ? st.error
      : p.locked ? '要先买这一格的通行证'
      : p.reason ? p.reason
      : live ? `跑在 127.0.0.1:${p.port_local}` : '可以在本机跑'

    const el = document.createElement('div')
    el.className = 'card'
    el.innerHTML = `
      <div class="name">${live ? '<span class="dot"></span> ' : ''}${p.name}</div>
      <div class="why"${st.error ? ' style="color:var(--bad)"' : ''}>${why}</div>
      <div class="row"></div>
      <div class="log">${st.log ?? ''}</div>`
    const row = el.querySelector('.row')

    if (live) {
      const open = document.createElement('button')
      open.className = 'primary'; open.textContent = '打开'
      open.onclick = () => window.aiStoreShelf.open(p.id)
      const halt = document.createElement('button')
      halt.textContent = '停止'
      halt.onclick = async () => {
        setUi(p.id, { busy: true })
        await window.aiStoreShelf.stop(p.id)
        ui.delete(p.id)
        refresh()
      }
      row.append(open, halt)
      return el
    }

    const run = document.createElement('button')
    run.className = 'primary'
    run.textContent = st.busy ? '启动中…' : (st.error ? '重试' : '在本机启动')
    // 没有 Docker 就不该点得动。横幅说着"暂时只能用云端", 按钮却照常可点,
    // 是在请用户去撞一堵墙 (2026-09-10 第一版就是这样, 老板一点三格全失败)。
    run.disabled = st.busy || !runnable || !latest.docker
    run.onclick = async () => {
      setUi(p.id, { busy: true, error: undefined })
      const out = await window.aiStoreShelf.start(p.id)
      if (out.ok) { ui.delete(p.id); refresh(); return }
      setUi(p.id, { busy: false, error: out.error })
    }
    row.append(run)
    return el
  }

  function render() {
    grid.replaceChildren(...latest.products.map(card))
  }

  async function refresh() {
    const out = await window.aiStoreShelf.list()
    latest = out
    banner.hidden = out.docker && !out.error
    if (out.error) banner.textContent = `目录拉不到：${out.error}`
    else if (!out.docker) {
      // 没装 Docker 不是错误状态 —— 云端那条路一直都在, 这里只说明少了什么。
      banner.textContent = '这台机器上没有可用的 Docker，所以暂时只能用云端工作台。装好 Docker Desktop 并启动后，回到这里点一下刷新即可。'
    }
    render()
  }

  refresh()
  // 只在没有任何一格正在启动时轮询: 拉镜像要几分钟, 中途重画会打断日志与按钮状态。
  setInterval(() => { if (![...ui.values()].some(s => s.busy)) refresh() }, 15000)
</script>
