<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta http-equiv="refresh" content="1;url=https://dshcloud.online" />
    <title>DSH Cloud</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        color: #e6edf3;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      main { max-width: 320px; padding: 28px; text-align: center; }
      .logo {
        width: 64px; height: 64px; margin: 0 auto 16px;
        border-radius: 14px;
        background: linear-gradient(135deg, #3574de, #1d52ad);
        display: grid; place-items: center;
        color: #fff; font: 700 26px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0; color: #8b949e; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">&gt;_</div>
      <h1>DSH Cloud</h1>
      <p>正在连接 DSH Cloud…</p>
    </main>
    <script>
      // Local startup fallback for cases where the configured remote page was not loaded.
      window.location.replace("https://dshcloud.online");
    </script>
  </body>
</html>
